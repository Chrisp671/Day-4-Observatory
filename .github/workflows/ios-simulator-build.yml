name: iOS Simulator Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}/repo

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Show runner and Xcode versions
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcode-select -p

      - name: Bootstrap sibling dependencies
        run: |
          set -o pipefail
          scripts/bootstrap_dependencies.sh https 2>&1 | tee ci-bootstrap.log

      - name: List Xcode project schemes
        run: xcodebuild -project Observatory.xcodeproj -list

      - name: Build Observatory for iOS Simulator
        run: |
          set -o pipefail
          scripts/build_simulator.sh 2>&1 | tee build.log

      - name: Package simulator app
        run: |
          app_path=".derivedData/Build/Products/Debug-iphonesimulator/Observatory.app"
          test -d "$app_path"
          ditto -c -k --keepParent "$app_path" Observatory-simulator-app.zip
          ls -lh Observatory-simulator-app.zip

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: Observatory-simulator-app
          if-no-files-found: error
          path: ${{ github.workspace }}/repo/Observatory-simulator-app.zip

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-ci-logs
          if-no-files-found: ignore
          path: |
            ${{ github.workspace }}/repo/ci-bootstrap.log
            ${{ github.workspace }}/repo/build.log
