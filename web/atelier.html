<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atelier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant:ital,wght@0,500;0,600;1,500;1,600;1,700&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root{
      --f0:#081627; --f1:#0E2440;
      --ink-hi:#E7F0FA; --ink-mid:#9BB9D6; --ink-low:#46648A;
      --sunlight:#F0B310; --scripture:#F3ECDA; --gold-soft:#E7BE5A;
      --serif:'Cormorant', Georgia, serif;
      --caps:'Cinzel', 'Times New Roman', serif;
      --mono:'IBM Plex Mono', ui-monospace, monospace;
      --hair:rgba(70,100,138,.42); --hair-soft:rgba(70,100,138,.25);
      --gild:linear-gradient(90deg,transparent,#D9A62B 22%,#F7DE93 50%,#D9A62B 78%,transparent);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      background:radial-gradient(125% 125% at 50% 42%, var(--f1) 0%, var(--f0) 82%);
      color:var(--ink-hi); font-family:var(--mono);
      max-width:390px; margin:0 auto; min-height:100dvh;
      display:flex; flex-direction:column;
    }
    /* Noon: the sky is a gradient, zenith above, lifted horizon below. */
    body[data-d="noon"]{
      background:linear-gradient(180deg,#183F73 0%,#245A9A 55%,#5B8DC4 100%);
    }
    #firm{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}

    header{display:flex;flex-direction:column;align-items:center;
      gap:7px;padding:15px 16px 0;flex:none}
    .brand{display:flex;align-items:center;justify-content:center;gap:12px;width:100%}
    .brand img{height:30px;display:block;filter:drop-shadow(0 2px 8px rgba(4,10,22,.6))}
    .verse{font-family:var(--serif);font-style:italic;font-weight:700;
      font-size:17px;line-height:1.35;color:var(--scripture);
      max-width:32ch;text-align:center;text-wrap:balance;
      text-shadow:0 1px 12px rgba(4,10,22,.8)}
    .vref{font-family:var(--caps);font-weight:700;font-size:9px;
      letter-spacing:.3em;color:var(--gold-soft);margin-top:1px;
      text-shadow:0 1px 8px rgba(4,10,22,.8)}
    .hero{display:flex;align-items:baseline;gap:.4em;white-space:nowrap;
      text-shadow:0 1px 10px rgba(4,10,22,.75)}
    .hero .k{font-family:var(--serif);font-style:italic;font-weight:700;
      font-size:22px;color:var(--ink-hi)}
    .hero .v{font-family:var(--mono);font-weight:500;font-size:20px;
      color:var(--sunlight);font-variant-numeric:tabular-nums}

    /* Frontispiece: the header set on an 8px rhythm — seal, rule, verse,
       citation, hero, rule — the logo framed as a maker's seal between
       gilded hairlines rather than floating as a raster. */
    body[data-d="frontispiece"] header{gap:0;padding-top:14px}
    body[data-d="frontispiece"] .brand{gap:14px;height:40px}
    body[data-d="frontispiece"] .brand::before,body[data-d="frontispiece"] .brand::after{
      content:"";height:1px;flex:1 1 0;background:var(--gild)}
    body[data-d="frontispiece"] .brand::before{background:linear-gradient(90deg,transparent,#D9A62B 60%,#F7DE93)}
    body[data-d="frontispiece"] .brand::after{background:linear-gradient(90deg,#F7DE93,#D9A62B 40%,transparent)}
    body[data-d="frontispiece"] .brand img{height:26px}
    body[data-d="frontispiece"] .verse{font-size:19px;line-height:1.3;margin-top:12px;
      max-width:34ch;position:relative;padding:0 6px}
    body[data-d="frontispiece"] .vref{margin-top:8px;font-size:9.5px;
      display:flex;align-items:center;gap:10px}
    body[data-d="frontispiece"] .vref::before,body[data-d="frontispiece"] .vref::after{
      content:"";width:18px;height:1px;background:var(--gold-soft);opacity:.55}
    body[data-d="frontispiece"] .hero{margin-top:14px;height:32px;align-items:center}
    body[data-d="frontispiece"] .hero .k{font-size:24px}
    body[data-d="frontispiece"] .hero .v{font-size:22px}
    body[data-d="frontispiece"] .stage{padding-top:4px}

    .stage{flex:none;display:grid;place-items:center;padding:8px 16px 2px}
    #dial{display:block}

    /* ————— the plinth: everything below the dial is one carved base ————— */
    .plinth{flex:none;margin:4px 16px 14px;
      border-top:1px solid;border-image:var(--gild) 1}
    .passion{font-family:var(--caps);font-weight:600;font-size:9px;
      letter-spacing:.22em;color:var(--gold-soft);text-align:center;padding-top:8px}
    .passion:empty{display:none}
    .bays{display:grid;grid-template-columns:1fr 1.25fr .9fr;padding:10px 0 9px}
    .bay{padding:0 10px;border-left:1px solid var(--hair)}
    .bay:first-child{border-left:none;padding-left:2px}
    .bay .k{font-family:var(--caps);font-weight:700;font-size:8.5px;
      letter-spacing:.24em;color:var(--ink-mid)}
    .bay .v{font-size:13.5px;line-height:1.45;color:var(--ink-hi);margin-top:5px;
      font-variant-numeric:tabular-nums;white-space:nowrap}
    .bay .s{font-size:10px;line-height:1.5;color:var(--ink-mid);margin-top:1px;
      font-variant-numeric:tabular-nums;white-space:nowrap}
    .rail{display:flex;align-items:stretch;border-top:1px solid var(--hair)}
    .cell{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
      padding:9px 0;border-left:1px solid var(--hair-soft)}
    .cell:first-child{border-left:none}
    .chev{color:var(--ink-low);font-size:12px;font-weight:300}
    .lab{font-family:var(--caps);font-weight:600;font-size:8.5px;
      letter-spacing:.16em;color:var(--ink-mid)}
    .nowb{flex:0 0 auto;display:flex;align-items:center;padding:9px 13px;
      border:0;border-left:1px solid var(--hair-soft);
      font-family:var(--caps);font-weight:700;font-size:9px;
      letter-spacing:.22em;color:var(--gold-soft);background:transparent}
    .ledger{border-top:1px solid var(--hair);padding:8px 2px 2px}
    .ledger-h{display:flex;align-items:baseline;gap:10px}
    .ledger-h .t{font-family:var(--caps);font-weight:700;font-size:9px;
      letter-spacing:.3em;color:var(--ink-mid)}
    .ledger-h .note{font-family:var(--serif);font-style:italic;font-weight:600;
      font-size:11.5px;color:var(--ink-mid)}
    .ledger-h .rule{flex:1;height:1px;background:var(--hair-soft);align-self:center}
    .lrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
      padding:6px 2px;border-bottom:1px solid var(--hair-soft)}
    .lrow:last-child{border-bottom:none}
    .lrow .n{font-family:var(--caps);font-weight:600;font-size:10px;
      letter-spacing:.14em;color:var(--ink-mid);white-space:nowrap}
    .lrow .d{font-size:11.5px;color:var(--ink-hi);font-variant-numeric:tabular-nums;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .lrow .n.up{color:var(--scripture)}
    .lrow .sw{display:inline-block;width:14px;height:2px;vertical-align:middle;
      margin-right:7px;border-radius:1px}

    /* Oculus: the expanded ledger is a program with movements, not a wall. */
    .section{display:flex;align-items:center;gap:10px;margin:12px 0 2px}
    .section .t{font-family:var(--caps);font-weight:700;font-size:8.5px;
      letter-spacing:.28em;color:var(--gold-soft)}
    .section .rule{flex:1;height:1px;background:var(--hair-soft)}
    .section .c{font-family:var(--mono);font-size:9px;color:var(--ink-low)}
    .cols{columns:2;column-gap:22px}
    .crow{display:flex;justify-content:space-between;gap:8px;padding:3px 0;
      break-inside:avoid;border-bottom:1px solid rgba(70,100,138,.14)}
    .crow .n{font-family:var(--caps);font-weight:600;font-size:9.5px;
      letter-spacing:.08em;color:var(--ink-mid);white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis}
    .crow.up .n{color:var(--scripture)}
    .crow .d{font-family:var(--mono);font-size:10px;color:var(--ink-mid);
      white-space:nowrap;font-variant-numeric:tabular-nums}
    .crow.up .d{color:var(--ink-hi)}
    .crow .mz{color:var(--gold-soft);font-size:8px;margin-left:4px}
    .foot{font-family:var(--serif);font-style:italic;font-size:11.5px;
      color:var(--gold-soft);text-align:center;margin-top:10px}

    /* Noon: the plinth is engraved into a lighter stone, so its lines and
       chevrons need more ink to hold. */
    body[data-d="noon"]{--hair:rgba(231,240,250,.30);--hair-soft:rgba(231,240,250,.18);
      --ink-mid:#C9DBEE;--ink-low:#9BB9D6}
    body[data-d="noon"] .chev{color:#C9DBEE}
  </style>
</head>
<body data-d="plinth">
  <canvas id="firm"></canvas>
  <header>
    <div class="brand"><img src="day4-logo-dark.png" alt="Day4 Astronomy"></div>
    <p class="verse">&ldquo;The heavens declare his righteousness, for God himself is judge!&rdquo;</p>
    <div class="vref">PSALM 50:6 &middot; ESV</div>
    <div class="hero"><span class="k" id="hero-k">—</span><span class="v" id="hero-v"></span></div>
  </header>
  <div class="stage"><canvas id="dial"></canvas></div>
  <section class="plinth">
    <p class="passion" id="passion"></p>
    <div class="bays">
      <div class="bay"><div class="k">SUN</div><div class="v" id="sun-v">—</div><div class="s" id="sun-s"></div></div>
      <div class="bay"><div class="k">MOON</div><div class="v" id="moon-v">—</div><div class="s" id="moon-s"></div></div>
      <div class="bay"><div class="k">STATION</div><div class="v" id="st-v">—</div><div class="s" id="st-s"></div></div>
    </div>
    <div class="rail">
      <div class="cell"><span class="chev">‹</span><span class="lab">HOUR</span><span class="chev">›</span></div>
      <div class="cell"><span class="chev">‹</span><span class="lab">DAY</span><span class="chev">›</span></div>
      <div class="cell"><span class="chev">‹</span><span class="lab">MONTH</span><span class="chev">›</span></div>
      <div class="cell"><span class="chev">‹</span><span class="lab">PHASE</span><span class="chev">›</span></div>
      <button class="nowb">NOW</button>
    </div>
    <div class="ledger">
      <div class="ledger-h"><span class="t">TONIGHT</span><span class="note" id="note"></span><span class="rule"></span></div>
      <div id="rows"></div>
      <div id="program"></div>
    </div>
  </section>
  <script type="module">
    import { frame } from "/src/engine/frame.ts";
    import { planetBoard, planetDays, moonDay, sunDay } from "/src/engine/planets.ts";
    import { passionHours } from "/src/app/hours.ts";
    import { fmt12, fmt12c } from "/src/app/clock12.ts";
    import { formatCountdown, nextSunEvent } from "/src/app/hero.ts";
    import { CONSTELLATIONS, isDarkEnough, tonightBoard } from "/src/app/constellations.ts";
    import { compassAbbrev } from "/src/app/transcript.ts";
    import { FACE, TAU, hourToAngle, localHoursOfDay, pointOnCircle } from "/src/ui/clockface.ts";
    import { buildGrain, drawGrain } from "/src/ui/grain.ts";
    import { drawDial } from "/src/ui/dial.ts";
    import { drawEarth } from "/src/ui/earth.ts";
    import { drawFiducial } from "/src/ui/fiducial.ts";
    import { drawMoon, drawMoonUpArc, drawMoonDisc, moonDialHours } from "/src/ui/moon.ts";
    import { drawAxis, drawPassionHours, drawWell } from "/src/ui/passion.ts";
    import { drawPlanetArcs, PLANET_COLORS } from "/src/ui/planetarcs.ts";
    import { drawSidereal } from "/src/ui/sidereal.ts";
    import { skyPalette } from "/src/ui/sky.ts";
    import { drawSun } from "/src/ui/sun.ts";
    import { drawFirmament } from "/src/ui/firmament.ts";
    import { goldLeaf, THEME } from "/src/ui/theme.ts";

    // ————— which direction, and when —————
    const q = new URLSearchParams(location.search);
    const D = q.get("d") ?? "plinth";
    const HOUR = q.get("t") ? Number(q.get("t")) : (D === "noon" ? 13 : 22);
    const T = new Date(2026, 7, 28, HOUR, 0, 0).getTime();
    const LAT = 40, LON = -74;
    document.body.dataset.d = D;
    if (HOUR >= 10 && HOUR < 17) document.body.classList.add("noon");
    document.title = `Atelier — ${D} @${HOUR}h`;

    const s = frame(T, LAT, LON);
    const tHours = localHoursOfDay(T);
    const pal = skyPalette(s.sun.altitudeDeg);
    document.documentElement.style.setProperty("--f0", pal.deep);
    document.documentElement.style.setProperty("--f1", pal.field);

    const DPR = 2;
    const SIZE = 358;
    const canvas = document.getElementById("dial");
    canvas.width = SIZE * DPR; canvas.height = SIZE * DPR;
    canvas.style.width = SIZE + "px"; canvas.style.height = SIZE + "px";
    const ctx = canvas.getContext("2d");
    const W = SIZE * DPR, R = W * 0.5 * 0.92;

    const firm = document.getElementById("firm");
    firm.width = 390 * DPR; firm.height = 844 * DPR;
    const fctx = firm.getContext("2d");
    fctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    // Feature flags per direction. Later directions build on the plinth so the
    // comparison isolates one move at a time.
    const BOLD_ARCS = D === "choir" || D === "oculus";
    const LABEL_ARCS = D === "choir" || D === "oculus";
    const TONDO = D === "noon";
    const QUIET_INTERIOR = D === "oculus";
    const PROGRAM = D === "oculus";

    // Geometry for the bolder arcs: the moon steps inward so the five arcs own
    // a clear band between the numerals and the moon's orbit.
    const MOON_ORBIT = BOLD_ARCS ? 0.60 : FACE.moonOrbit;
    const SIDEREAL = BOLD_ARCS ? 0.49 : FACE.sidereal;
    const ARC_OUTER = BOLD_ARCS ? 0.80 : 0.845;
    const ARC_STEP = BOLD_ARCS ? 0.026 : 0.022;

    const riseH = s.sun.nextRiseUnixMillis === null ? null : localHoursOfDay(s.sun.nextRiseUnixMillis);
    const setH = s.sun.nextSetUnixMillis === null ? null : localHoursOfDay(s.sun.nextSetUnixMillis);

    /* ————— the tondo: by day the dial keeps its own night ————— */
    function drawTondo() {
      const r = R * (FACE.dialOuter + 0.012);
      const g = ctx.createRadialGradient(0, -R * 0.15, R * 0.2, 0, 0, r);
      g.addColorStop(0, "rgba(14,36,64,0.78)");
      g.addColorStop(0.75, "rgba(10,26,48,0.88)");
      g.addColorStop(1, "rgba(8,22,39,0.96)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
      // A bevelled rim: the tondo is set into the page like a medallion.
      ctx.lineWidth = 1 * DPR;
      ctx.strokeStyle = "rgba(247,222,147,0.35)";
      ctx.beginPath(); ctx.arc(0, 0, r + 1.5 * DPR, 0, TAU); ctx.stroke();
      ctx.strokeStyle = "rgba(4,10,22,0.55)";
      ctx.beginPath(); ctx.arc(0, 0, r - 1 * DPR, 0, TAU); ctx.stroke();
    }

    /* ————— the sun by day: a corona, since by day the sun is the sky ————— */
    function drawSunCorona() {
      const a = hourToAngle(tHours);
      const rMid = (R * (FACE.dialOuter + FACE.dialInner)) / 2;
      const pos = pointOnCircle(a, rMid);
      const up = Math.max(0, Math.min(1, s.sun.altitudeDeg / 10));
      if (up > 0) {
        const r0 = R * FACE.sunDisc;
        const g = ctx.createRadialGradient(pos.x, pos.y, r0 * 0.8, pos.x, pos.y, r0 * 4.2);
        g.addColorStop(0, `rgba(255,247,221,${0.5 * up})`);
        g.addColorStop(0.4, `rgba(247,222,147,${0.2 * up})`);
        g.addColorStop(1, "rgba(240,179,16,0)");
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(pos.x, pos.y, r0 * 4.2, 0, TAU); ctx.fill();
      }
      drawSun(ctx, R, DPR, tHours, pal.sunCore);
    }

    /* ————— quiet interior: sidereal ring as a hairline scale ————— */
    function drawSiderealQuiet(siderealHours) {
      const r = R * SIDEREAL;
      ctx.save();
      ctx.rotate(-(siderealHours / 24) * TAU);
      ctx.lineWidth = 0.7 * DPR;
      ctx.strokeStyle = THEME.inkLow; ctx.globalAlpha = 0.55;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
      for (let i = 0; i < 24; i++) {
        const a = (i / 24) * TAU, major = i % 6 === 0, t = major ? R * 0.016 : R * 0.008;
        ctx.globalAlpha = major ? 0.8 : 0.45;
        ctx.strokeStyle = major ? THEME.inkMid : THEME.inkLow;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * (r - t), Math.sin(a) * (r - t));
        ctx.lineTo(Math.cos(a) * (r + t), Math.sin(a) * (r + t));
        ctx.stroke();
      }
      // Four Giotto stars riding the ring, as before, but gold now: the fixed
      // stars are the one thing in the interior that deserves the material.
      ctx.lineWidth = 0.9 * DPR; ctx.globalAlpha = 0.9;
      for (let i = 0; i < 4; i++) {
        const a = (i / 4) * TAU + 0.42;
        const x = Math.cos(a) * r, y = Math.sin(a) * r, sg = R * 0.016;
        ctx.strokeStyle = goldLeaf(ctx, y - sg, y + sg);
        ctx.beginPath();
        ctx.moveTo(x - sg, y); ctx.lineTo(x + sg, y);
        ctx.moveTo(x, y - sg); ctx.lineTo(x, y + sg);
        ctx.stroke();
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    /* ————— text along an arc, reading outward, for the arc labels ————— */
    function textAlongArc(text, r, centreAngle, color, px) {
      ctx.save();
      ctx.font = `600 ${Math.round(px * DPR)}px ${THEME.fontCaps}`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillStyle = color;
      const widths = [...text].map((ch) => ctx.measureText(ch).width + 0.9 * DPR);
      const total = widths.reduce((a, b) => a + b, 0);
      // Text on the lower half of the dial must read the other way up.
      const lower = Math.sin(centreAngle) > 0;
      let a = centreAngle - (lower ? -1 : 1) * (total / 2) / r;
      [...text].forEach((ch, i) => {
        const w = widths[i];
        a += (lower ? -1 : 1) * (w / 2) / r;
        ctx.save();
        ctx.translate(Math.cos(a) * r, Math.sin(a) * r);
        ctx.rotate(a + Math.PI / 2 + (lower ? Math.PI : 0));
        ctx.fillText(ch, 0, 0);
        ctx.restore();
        a += (lower ? -1 : 1) * (w / 2) / r;
      });
      ctx.restore();
    }

    /* ————— the choir: five arcs that can be read from across the room ————— */
    function drawPlanetArcsBold(arcs) {
      ctx.save();
      ctx.lineCap = "round";
      arcs.forEach((arc, i) => {
        const r = R * (ARC_OUTER - i * ARC_STEP);
        const color = PLANET_COLORS[arc.name] ?? "#9FA6B8";
        // A dark keel under each arc lifts it off the field.
        ctx.strokeStyle = "rgba(4,10,22,0.55)";
        ctx.globalAlpha = 1; ctx.lineWidth = 4.2 * DPR;
        ctx.beginPath(); ctx.arc(0, 0, r, hourToAngle(arc.riseHours), hourToAngle(arc.setHours)); ctx.stroke();
        ctx.strokeStyle = color; ctx.globalAlpha = 0.92; ctx.lineWidth = 2.6 * DPR;
        ctx.beginPath(); ctx.arc(0, 0, r, hourToAngle(arc.riseHours), hourToAngle(arc.setHours)); ctx.stroke();
        if (arc.transitHours !== null) {
          const p = pointOnCircle(hourToAngle(arc.transitHours), r);
          ctx.fillStyle = "#04070E"; ctx.globalAlpha = 0.9;
          ctx.beginPath(); ctx.arc(p.x, p.y, 3.6 * DPR, 0, TAU); ctx.fill();
          ctx.fillStyle = color; ctx.globalAlpha = 1;
          ctx.beginPath(); ctx.arc(p.x, p.y, 2.4 * DPR, 0, TAU); ctx.fill();
        }
        if (LABEL_ARCS) {
          // The name sits at the rise end, on the arc, in the arc's own colour.
          const span = ((arc.setHours - arc.riseHours) % 24 + 24) % 24;
          const at = hourToAngle(arc.riseHours + Math.min(1.6, span * 0.18));
          const name = arc.name.toUpperCase();
          ctx.save();
          ctx.shadowColor = "rgba(4,10,22,0.9)"; ctx.shadowBlur = 3 * DPR;
          textAlongArc(name, r, at, color, 7.4);
          ctx.restore();
        }
      });
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    /* ————— the moon, on whichever orbit the direction gives it ————— */
    function drawMoonAt(orbitFrac, dialHours, phaseAngleDeg, construction) {
      const orbitR = R * orbitFrac, discR = R * 0.075;
      const a = hourToAngle(dialHours);
      if (construction) {
        const gap = 2 * Math.atan(discR / orbitR) * 2;
        ctx.lineWidth = 0.8 * DPR; ctx.strokeStyle = THEME.inkLow; ctx.globalAlpha = 0.95;
        ctx.beginPath(); ctx.arc(0, 0, orbitR, a + gap / 2, a - gap / 2 + TAU); ctx.stroke();
        ctx.globalAlpha = 1;
      }
      const pos = pointOnCircle(a, orbitR);
      drawMoonDisc(ctx, pos.x, pos.y, discR, phaseAngleDeg, DPR);
    }
    function drawMoonUpArcAt(orbitFrac, rise, set) {
      if (rise === null || set === null) return;
      ctx.save();
      ctx.strokeStyle = THEME.moonlight; ctx.globalAlpha = BOLD_ARCS ? 0.55 : 0.4;
      ctx.lineWidth = (BOLD_ARCS ? 2.8 : 2.4) * DPR; ctx.lineCap = "round";
      ctx.beginPath(); ctx.arc(0, 0, R * orbitFrac, hourToAngle(rise), hourToAngle(set)); ctx.stroke();
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    function render() {
      drawFirmament(fctx, 390, 844, pal.starAlpha, pal.horizonGlow);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, W, W);
      drawGrain(ctx, W, W);
      ctx.translate(W / 2, W / 2);

      if (TONDO) drawTondo();

      if (QUIET_INTERIOR || BOLD_ARCS) drawSiderealQuiet(s.siderealHours);
      else drawSidereal(ctx, R, DPR, s.siderealHours);

      drawDial(ctx, R, DPR, { riseHours: riseH, setHours: setH });

      const passion = passionHours(s.sun.dayRiseUnixMillis, s.sun.daySetUnixMillis);
      if (passion !== null) {
        drawPassionHours(ctx, R, DPR,
          localHoursOfDay(passion.fromUnixMillis), localHoursOfDay(passion.toUnixMillis));
      }
      drawWell(ctx, R);
      drawAxis(ctx, R, DPR, TONDO ? 0.85 : 0.55 + 0.45 * pal.starAlpha);
      drawEarth(ctx, R, DPR, hourToAngle(tHours));

      const arcs = planetDays(T, LAT, LON)
        .filter((p) => p.riseUnixMillis !== null && p.setUnixMillis !== null)
        .map((p) => ({
          name: p.name,
          riseHours: localHoursOfDay(p.riseUnixMillis),
          setHours: localHoursOfDay(p.setUnixMillis),
          transitHours: p.transitUnixMillis === null ? null : localHoursOfDay(p.transitUnixMillis),
        }));
      if (BOLD_ARCS) drawPlanetArcsBold(arcs);
      else drawPlanetArcs(ctx, R, DPR, arcs);

      const md = moonDay(T, LAT, LON);
      const mRise = md.riseUnixMillis === null ? null : localHoursOfDay(md.riseUnixMillis);
      const mSet = md.setUnixMillis === null ? null : localHoursOfDay(md.setUnixMillis);
      const mHours = moonDialHours(tHours, s.sun.hourAngleHours, s.moon.hourAngleHours);
      if (BOLD_ARCS) {
        drawMoonUpArcAt(MOON_ORBIT, mRise, mSet);
        drawMoonAt(MOON_ORBIT, mHours, s.moon.phaseAngleDeg, !QUIET_INTERIOR);
      } else {
        drawMoonUpArc(ctx, R, DPR, mRise, mSet);
        drawMoon(ctx, R, DPR, mHours, s.moon.phaseAngleDeg);
      }

      if (TONDO) drawSunCorona();
      else drawSun(ctx, R, DPR, tHours, pal.sunCore);
      drawFiducial(ctx, R, DPR, tHours, tHours);
    }

    /* ————— the plinth's text ————— */
    function row(host, n, d, up, color) {
      const div = document.createElement("div");
      div.className = "lrow";
      const nn = document.createElement("span");
      nn.className = "n" + (up ? " up" : "");
      if (color) {
        const sw = document.createElement("i");
        sw.className = "sw"; sw.style.background = color;
        nn.appendChild(sw);
        nn.style.color = color;
      }
      nn.appendChild(document.createTextNode(n));
      const dd = document.createElement("span");
      dd.className = "d"; dd.textContent = d;
      div.append(nn, dd);
      host.appendChild(div);
    }

    function planetLine(b) {
      const next = b.upNow ? b.setUnixMillis : b.riseUnixMillis;
      let d = next === null ? "" : `${b.upNow ? "sets in" : "rises in"} ${formatCountdown(next - T)}`;
      if (b.upNow) d += ` · ${Math.round(b.altitudeDeg)}° ${compassAbbrev(b.azimuthDeg)}`;
      if (b.upNow && b.transitUnixMillis !== null && b.setUnixMillis !== null && b.transitUnixMillis < b.setUnixMillis) {
        d += ` ⋆${fmt12c(b.transitUnixMillis)}`;
      }
      return d;
    }
    const skyLine = (e) => {
      const c = formatCountdown(e.untilMillis ?? 0);
      return e.status === "circumpolar" ? "all night" : e.status === "up" ? `sets ${c}` : `rises ${c}`;
    };

    function fillDom() {
      const ev = nextSunEvent(s.sun.nextRiseUnixMillis, s.sun.nextSetUnixMillis);
      if (ev !== null) {
        document.getElementById("hero-k").textContent = ev.kind === "sunset" ? "Sunset in" : "Sunrise in";
        document.getElementById("hero-v").textContent = formatCountdown(ev.atUnixMillis - T);
      }
      const sd = sunDay(T, LAT, LON);
      document.getElementById("sun-v").textContent = sd.riseUnixMillis === null ? "—" : `↑${fmt12c(sd.riseUnixMillis)}`;
      document.getElementById("sun-s").textContent = sd.setUnixMillis === null ? "" : `↓${fmt12c(sd.setUnixMillis)}`;
      const phaseIdx = Math.floor((s.moon.phaseAngleDeg / 360) * 8 + 0.5) % 8;
      const NAMES = ["new moon", "waxing crescent", "first quarter", "waxing gibbous", "full moon", "waning gibbous", "last quarter", "waning crescent"];
      document.getElementById("moon-v").textContent = `${s.moon.ageDays.toFixed(1)}d ${NAMES[phaseIdx] ?? ""}`;
      const md = moonDay(T, LAT, LON);
      let mt = md.riseUnixMillis === null ? "no moonrise today" : `↑${fmt12c(md.riseUnixMillis)}`;
      if (md.riseUnixMillis !== null && md.setUnixMillis !== null) {
        const setD = new Date(md.setUnixMillis);
        const tag = setD.getDate() === new Date(T).getDate() ? "" : ` ${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][setD.getDay()]}`;
        mt += ` · ↓${fmt12c(md.setUnixMillis)}${tag}`;
      }
      document.getElementById("moon-s").textContent = mt;
      document.getElementById("st-v").textContent = `40.0°N`;
      document.getElementById("st-s").textContent = `74.0°W`;

      const inPassion = passionHours(s.sun.dayRiseUnixMillis, s.sun.daySetUnixMillis);
      const p = inPassion !== null && T >= inPassion.fromUnixMillis && T <= inPassion.toUnixMillis ? inPassion : null;
      document.getElementById("passion").textContent = p
        ? `THE SIXTH HOUR TO THE NINTH · ${fmt12(p.fromUnixMillis)}–${fmt12(p.toUnixMillis)}`.toUpperCase()
        : "";
      document.getElementById("note").textContent = isDarkEnough(s.sun.altitudeDeg) ? "" : "visible after dark";

      const board = planetBoard(T, LAT, LON);
      const lst = s.siderealHours + LON / 15;
      const host = document.getElementById("rows");

      if (!PROGRAM) {
        // The glance board: Saturn, Jupiter, one headliner constellation.
        const cons = tonightBoard(lst, LAT, CONSTELLATIONS.filter((c) => c.notable === true))
          .filter((e) => e.status !== "never");
        const favs = board.filter((b) => b.name === "Saturn" || b.name === "Jupiter");
        for (const b of favs) row(host, b.name, planetLine(b), b.upNow, LABEL_ARCS ? PLANET_COLORS[b.name] : null);
        for (const e of cons) {
          if (host.children.length >= 3) break;
          row(host, e.constellation.name, skyLine(e).replace(/^(sets|rises) /, "$1 in "), e.status !== "down", null);
        }
        return;
      }

      // The program (oculus): the fold opened, as movements — the wandering
      // stars first, then what is up, then what is still to rise — each
      // section counted, the Mazzaroth starred, never-risers left out.
      const prog = document.getElementById("program");
      const section = (title, count) => {
        const h = document.createElement("div"); h.className = "section";
        h.innerHTML = `<span class="t">${title}</span><span class="rule"></span><span class="c">${count}</span>`;
        prog.appendChild(h);
      };
      section("THE WANDERING STARS", "5");
      for (const b of board) row(prog, b.name, planetLine(b), b.upNow, PLANET_COLORS[b.name]);
      const all = tonightBoard(lst, LAT).filter((e) => e.status !== "never");
      const up = all.filter((e) => e.status !== "down");
      const rising = all.filter((e) => e.status === "down");
      const cols = (list) => {
        const c = document.createElement("div"); c.className = "cols";
        for (const e of list) {
          const r = document.createElement("div");
          r.className = "crow" + (e.status === "down" ? "" : " up");
          const mz = e.constellation.mazzaroth === true ? `<i class="mz">★</i>` : "";
          r.innerHTML = `<span class="n">${e.constellation.name}${mz}</span><span class="d">${skyLine(e)}</span>`;
          c.appendChild(r);
        }
        prog.appendChild(c);
      };
      section("UP NOW", String(up.length)); cols(up);
      section("STILL TO RISE", String(rising.length)); cols(rising);
      const f = document.createElement("div"); f.className = "foot";
      f.innerHTML = "★ Mazzaroth — the constellations of the sun’s path, led out in their season (Job 38:32)";
      prog.appendChild(f);
    }

    document.fonts.ready.then(() => {
      buildGrain(ctx);
      render();
      fillDom();
    });
  </script>
</body>
</html>
