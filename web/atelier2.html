<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atelier II — uncrowding</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant:ital,wght@0,500;0,600;1,500;1,600;1,700&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root{
      --print-0:#081627; --print-1:#0E2440;
      --ink-hi:#E7F0FA; --ink-mid:#9BB9D6; --ink-low:#46648A;
      --sunlight:#F0B310; --scripture:#F3ECDA; --gold-soft:#E7BE5A;
      --serif:'Cormorant', Georgia, serif;
      --caps:'Cinzel', 'Times New Roman', serif;
      --mono:'IBM Plex Mono', ui-monospace, monospace;
      --hair:rgba(155,185,214,.28); --hair-soft:rgba(155,185,214,.16);
      --gild:linear-gradient(90deg,transparent,#D9A62B 22%,#F7DE93 50%,#D9A62B 78%,transparent);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{background:radial-gradient(125% 125% at 50% 42%, var(--print-1) 0%, var(--print-0) 82%);
      color:var(--ink-hi);font-family:var(--mono);max-width:390px;margin:0 auto;
      min-height:100dvh;display:flex;flex-direction:column;position:relative}
    #firm{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
    header{display:flex;flex-direction:column;align-items:center;padding:14px 16px 0;flex:none}
    .brand{display:flex;align-items:center;justify-content:center;gap:14px;width:100%;height:40px}
    .brand::before,.brand::after{content:"";height:1px;flex:1 1 0}
    .brand::before{background:linear-gradient(90deg,transparent,#D9A62B 60%,#F7DE93)}
    .brand::after{background:linear-gradient(90deg,#F7DE93,#D9A62B 40%,transparent)}
    .brand img{height:26px;display:block;filter:drop-shadow(0 2px 10px rgba(4,10,22,.6))}
    .verse{font-family:var(--serif);font-style:italic;font-weight:700;font-size:19px;line-height:1.3;
      color:var(--scripture);max-width:34ch;text-align:center;text-wrap:balance;margin-top:12px;padding:0 6px;
      text-shadow:0 1px 14px rgba(4,10,22,.85)}
    .vref{font-family:var(--caps);font-weight:700;font-size:9.5px;letter-spacing:.3em;color:var(--gold-soft);
      margin-top:8px;display:flex;align-items:center;gap:10px;text-shadow:0 1px 10px rgba(4,10,22,.8)}
    .vref::before,.vref::after{content:"";width:18px;height:1px;background:var(--gold-soft);opacity:.55}
    .hero{display:flex;align-items:baseline;gap:.45em;white-space:nowrap;margin-top:14px;
      text-shadow:0 1px 12px rgba(4,10,22,.75)}
    .hero .k{font-family:var(--serif);font-style:italic;font-weight:700;font-size:24px}
    .hero .v{font-family:var(--mono);font-weight:500;font-size:22px;color:var(--sunlight);font-variant-numeric:tabular-nums}
    .travelled{font-family:var(--serif);font-style:italic;font-weight:600;font-size:14px;color:var(--sunlight);margin-top:5px}
    .travelled:empty{display:none}
    .stage{flex:none;display:grid;place-items:center;padding:4px 16px 2px}
    #dial{display:block}

    /* The plinth stands on clean ground: a scrim fades the firmament out
       beneath it so type never competes with stars. */
    .plinth{flex:none;padding:0 16px 14px;position:relative}
    .plinth::before{content:"";position:absolute;left:0;right:0;top:-40px;bottom:0;z-index:-1;
      background:linear-gradient(180deg,rgba(8,22,39,0) 0%,rgba(8,22,39,.85) 40px,rgba(8,22,39,.92) 100%)}
    .plinth-in{border-top:1px solid;border-image:var(--gild) 1}
    .bays{display:grid;grid-template-columns:.95fr 1.3fr 1.1fr;padding:10px 0 9px}
    .bay{padding:0 8px;border-left:1px solid var(--hair);min-width:0}
    .bay:first-child{border-left:none;padding-left:2px}
    .bay .k{font-family:var(--caps);font-weight:700;font-size:8.5px;letter-spacing:.24em;color:var(--ink-mid)}
    .bay .v{font-size:13.5px;line-height:1.4;color:var(--ink-hi);margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
    .bay .s{font-size:10px;line-height:1.5;color:var(--ink-mid);margin-top:1px;font-variant-numeric:tabular-nums;white-space:nowrap}
    .bay .s b{font-weight:500;color:var(--sunlight)}
    .bay .s .zone{font-family:var(--caps);font-weight:600;font-size:.85em;letter-spacing:.14em}
    .rail{display:flex;align-items:stretch;border-top:1px solid var(--hair)}
    .cell{flex:1;display:flex;align-items:center;justify-content:center;min-width:0;padding:9px 0}
    .chev{color:var(--ink-mid);font-size:14px;font-weight:300;padding:0 4px}
    .lab{font-family:var(--caps);font-weight:600;font-size:8.5px;letter-spacing:.12em;color:var(--ink-mid)}
    .nowb{flex:0 0 auto;padding:9px 10px;border:0;font-family:var(--caps);font-weight:700;font-size:9.5px;
      letter-spacing:.22em;color:var(--gold-soft);background:transparent}
    .ledger{border-top:1px solid var(--hair);padding:8px 2px 0}
    .ledger-h{display:flex;align-items:baseline;gap:10px}
    .ledger-h .t{font-family:var(--caps);font-weight:700;font-size:9.5px;letter-spacing:.3em;color:var(--ink-mid)}
    .ledger-h em{font-family:var(--serif);font-style:italic;font-weight:600;font-size:12px;color:var(--ink-mid)}
    .ledger-h .rule{flex:1;height:1px;background:var(--hair-soft);align-self:center}
    .lrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:5px 2px;
      border-bottom:1px solid var(--hair-soft)}
    .lrow:last-child{border-bottom:none}
    .lrow .n{font-family:var(--caps);font-weight:600;font-size:10.5px;letter-spacing:.14em;color:var(--ink-mid);
      white-space:nowrap;flex-shrink:0}
    .lrow .d{font-size:11.5px;color:var(--ink-hi);font-variant-numeric:tabular-nums;white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis}
    .lrow.is-up .n{color:var(--scripture)}
    .lrow .sw{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:7px;border-radius:2px}
    /* The chosen one: the row that owns the dial's single arc. */
    .lrow.chosen .n{color:var(--sunlight)}
    .lrow.chosen .d{color:var(--scripture)}
    .lrow .tap{font-family:var(--serif);font-style:italic;font-size:11px;color:var(--ink-low);margin-left:6px}
  </style>
</head>
<body>
  <canvas id="firm"></canvas>
  <header>
    <div class="brand"><img src="day4-logo-dark.png" alt="Day4 Astronomy"></div>
    <p class="verse">&ldquo;Who made the Bear and Orion, the Pleiades and the chambers of the south.&rdquo;</p>
    <div class="vref">JOB 9:9 &middot; ESV</div>
    <div class="hero"><span class="k" id="hero-k">—</span><span class="v" id="hero-v"></span></div>
    <div class="travelled" id="travelled"></div>
  </header>
  <div class="stage"><canvas id="dial"></canvas></div>
  <section class="plinth"><div class="plinth-in">
    <div class="bays">
      <div class="bay"><div class="k">SUN</div><div class="v" id="sun-v">—</div><div class="s" id="sun-s"></div></div>
      <div class="bay"><div class="k">MOON</div><div class="v" id="moon-v">—</div><div class="s" id="moon-s"></div></div>
      <div class="bay"><div class="k">STATION</div><div class="v">40.0°N 74.0°W</div><div class="s"><b id="clock">—</b> <span class="zone">GMT-5</span></div></div>
    </div>
    <div class="rail">
      <div class="cell"><span class="chev">‹</span><span class="lab">HOUR</span><span class="chev">›</span></div>
      <div class="cell"><span class="chev">‹</span><span class="lab">DAY</span><span class="chev">›</span></div>
      <div class="cell"><span class="chev">‹</span><span class="lab">PHASE</span><span class="chev">›</span></div>
      <div class="cell"><span class="chev">‹</span><span class="lab">MONTH</span><span class="chev">›</span></div>
      <button class="nowb">NOW</button>
    </div>
    <div class="ledger">
      <div class="ledger-h"><span class="t">TONIGHT</span><em id="note"></em><span class="rule"></span></div>
      <div id="rows"></div>
    </div>
  </div></section>
  <script type="module">
    import { frame } from "/src/engine/frame.ts";
    import { planetBoard, planetDays, moonDay, sunDay } from "/src/engine/planets.ts";
    import { passionHours } from "/src/app/hours.ts";
    import { fmt12, fmt12c } from "/src/app/clock12.ts";
    import { formatCountdown, nextSunEvent } from "/src/app/hero.ts";
    import { CONSTELLATIONS, isDarkEnough, tonightBoard } from "/src/app/constellations.ts";
    import { compassAbbrev } from "/src/app/transcript.ts";
    import { FACE, TAU, hourToAngle, localHoursOfDay, pointOnCircle } from "/src/ui/clockface.ts";
    import { buildGrain, drawGrain } from "/src/ui/grain.ts";
    import { drawDial } from "/src/ui/dial.ts";
    import { drawEarth } from "/src/ui/earth.ts";
    import { drawFiducial } from "/src/ui/fiducial.ts";
    import { drawMoonDisc, moonDialHours } from "/src/ui/moon.ts";
    import { drawAxis, drawPassionHours, drawWell } from "/src/ui/passion.ts";
    import { PLANET_COLORS, RING_ORDER } from "/src/ui/planetarcs.ts";
    import { skyPalette } from "/src/ui/sky.ts";
    import { drawSun } from "/src/ui/sun.ts";
    import { drawFirmament } from "/src/ui/firmament.ts";
    import { drawGround, groundStrength } from "/src/ui/ground.ts";
    import { goldLeaf, THEME } from "/src/ui/theme.ts";

    const q = new URLSearchParams(location.search);
    const D = q.get("d") ?? "tonight";       // tonight | rete | one
    const when = q.get("when") ?? "feb";      // feb (Parker's shot) | now
    const T = when === "feb"
      ? new Date(2027, 1, 11, 16, 52, 0).getTime()
      : new Date(2026, 8, 2, 22, 0, 0).getTime();
    const LAT = 40, LON = -74;
    document.title = `Atelier II — ${D} / ${when}`;

    const s = frame(T, LAT, LON);
    const tHours = localHoursOfDay(T);
    const pal = skyPalette(s.sun.altitudeDeg);
    document.documentElement.style.setProperty("--print-0", pal.deep);
    document.documentElement.style.setProperty("--print-1", pal.field);

    const DPR = 2, SIZE = 358;
    const canvas = document.getElementById("dial");
    canvas.width = SIZE * DPR; canvas.height = SIZE * DPR;
    canvas.style.width = SIZE + "px"; canvas.style.height = SIZE + "px";
    const ctx = canvas.getContext("2d");
    const W = SIZE * DPR;
    // The rete gives the rim to the arcs, so the band steps inward.
    const R = D === "rete" ? W * 0.5 * 0.80 : W * 0.5 * 0.92;

    const firm = document.getElementById("firm");
    firm.width = 390 * DPR; firm.height = 844 * DPR;
    const fctx = firm.getContext("2d"); fctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    const riseH = s.sun.nextRiseUnixMillis === null ? null : localHoursOfDay(s.sun.nextRiseUnixMillis);
    const setH = s.sun.nextSetUnixMillis === null ? null : localHoursOfDay(s.sun.nextSetUnixMillis);
    const span = (a, b) => ((b - a) % 24 + 24) % 24;

    // Arcs for the day, and whether each one matters after dark: a planet
    // earns an arc only if it is above the horizon for at least an hour of
    // real night (sun below the horizon) on this date.
    const dayRise = s.sun.dayRiseUnixMillis === null ? 6 : localHoursOfDay(s.sun.dayRiseUnixMillis);
    const daySet = s.sun.daySetUnixMillis === null ? 18 : localHoursOfDay(s.sun.daySetUnixMillis);
    const nightHours = (rise, set) => {
      // overlap of [rise, set] with the night [daySet, dayRise+24], in hours
      let total = 0;
      for (let h = 0; h < span(rise, set); h += 0.1) {
        const t = (rise + h) % 24;
        if (span(daySet, t) < span(daySet, dayRise)) total += 0.1;
      }
      return total;
    };
    const allArcs = planetDays(T, LAT, LON)
      .filter((p) => p.riseUnixMillis !== null && p.setUnixMillis !== null)
      .map((p) => ({
        name: p.name,
        riseHours: localHoursOfDay(p.riseUnixMillis),
        setHours: localHoursOfDay(p.setUnixMillis),
        transitHours: p.transitUnixMillis === null ? null : localHoursOfDay(p.transitUnixMillis),
      }))
      .map((a) => ({ ...a, night: nightHours(a.riseHours, a.setHours) }));
    const nightArcs = allArcs.filter((a) => a.night >= 1);
    const CHOSEN = q.get("pick") ?? "Saturn";
    const ORDER = q.get("order") ?? "spheres";   // spheres (Mercury in) | helio (Mercury by the Sun's band)
    const LIT = q.get("lit");                     // rete: one ring lit, the rest dimmed
    const idx = (name) => ORDER === "helio" ? 4 - RING_ORDER.indexOf(name) : RING_ORDER.indexOf(name);

    function diamond(angle, r, hl, hw) {
      const p = pointOnCircle(angle, r);
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(angle);
      ctx.beginPath(); ctx.moveTo(hl, 0); ctx.lineTo(0, hw); ctx.lineTo(-hl, 0); ctx.lineTo(0, -hw); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    function arc(a, r, width, alpha) {
      const color = PLANET_COLORS[a.name] ?? "#9FA6B8";
      ctx.save(); ctx.lineCap = "round";
      ctx.strokeStyle = "rgba(4,10,22,0.55)"; ctx.lineWidth = (width + 1.6) * DPR;
      ctx.beginPath(); ctx.arc(0, 0, r, hourToAngle(a.riseHours), hourToAngle(a.setHours)); ctx.stroke();
      ctx.strokeStyle = color; ctx.globalAlpha = alpha; ctx.lineWidth = width * DPR;
      ctx.beginPath(); ctx.arc(0, 0, r, hourToAngle(a.riseHours), hourToAngle(a.setHours)); ctx.stroke();
      if (a.transitHours !== null) {
        const ta = hourToAngle(a.transitHours), py = pointOnCircle(ta, r).y;
        ctx.globalAlpha = 1; ctx.fillStyle = "rgba(4,10,22,0.8)"; diamond(ta, r, R * 0.014 + 1.2 * DPR, R * 0.009 + 1.2 * DPR);
        ctx.fillStyle = goldLeaf(ctx, py - R * 0.014, py + R * 0.014); diamond(ta, r, R * 0.014, R * 0.009);
      }
      ctx.restore();
    }

    function render() {
      drawFirmament(fctx, 390, 844, pal.starAlpha, pal.horizonGlow);
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, W); drawGrain(ctx, W, W);
      ctx.translate(W / 2, W / 2);
      drawGround(ctx, R, DPR, groundStrength(s.sun.altitudeDeg));
      drawDial(ctx, R, DPR, { riseHours: riseH, setHours: setH });
      const passion = passionHours(s.sun.dayRiseUnixMillis, s.sun.daySetUnixMillis);
      if (passion !== null) drawPassionHours(ctx, R, DPR, localHoursOfDay(passion.fromUnixMillis), localHoursOfDay(passion.toUnixMillis));
      drawWell(ctx, R);
      drawAxis(ctx, R, DPR, 0.55 + 0.45 * pal.starAlpha);
      drawEarth(ctx, R, DPR, hourToAngle(tHours));

      // Moon: on its orbit, no construction line, its up-arc only.
      const md = moonDay(T, LAT, LON);
      const mRise = md.riseUnixMillis === null ? null : localHoursOfDay(md.riseUnixMillis);
      const mSet = md.setUnixMillis === null ? null : localHoursOfDay(md.setUnixMillis);
      const moonR = D === "rete" ? R * 0.68 : R * 0.565;

      if (D === "all") {
        allArcs.forEach((a) => arc(a, R * (0.64 + idx(a.name) * 0.03), 2.6, 0.92));
      } else if (D === "tonight") {
        // Only the planets that matter after dark, stacked from 0.76 inward.
        nightArcs.forEach((a) => arc(a, R * (0.64 + idx(a.name) * 0.03), 2.6, 0.92));
      } else if (D === "rete") {
        // All five outside the band, thin, like the original's rings.
        allArcs.forEach((a) => arc(a, R * (1.06 + idx(a.name) * 0.038), LIT === a.name ? 3.2 : 2.2, LIT ? (LIT === a.name ? 1 : 0.28) : (a.night >= 1 ? 0.92 : 0.35)));
      } else {
        // One chosen object, full weight, alone.
        const a = allArcs.find((x) => x.name === CHOSEN);
        if (a) arc(a, R * 0.74, 3.4, 0.95);
      }

      if (mRise !== null && mSet !== null) {
        ctx.save(); ctx.strokeStyle = THEME.moonlight; ctx.globalAlpha = 0.5; ctx.lineWidth = 2.8 * DPR; ctx.lineCap = "round";
        ctx.beginPath(); ctx.arc(0, 0, moonR, hourToAngle(mRise), hourToAngle(mSet)); ctx.stroke(); ctx.restore();
      }
      const mp = pointOnCircle(hourToAngle(moonDialHours(tHours, s.sun.hourAngleHours, s.moon.hourAngleHours)), moonR);
      drawMoonDisc(ctx, mp.x, mp.y, R * 0.075, s.moon.phaseAngleDeg, DPR);

      drawSun(ctx, R, DPR, tHours, pal.sunCore);
      drawFiducial(ctx, R, DPR, localHoursOfDay(Date.now()), tHours);
    }

    function fillDom() {
      const ev = nextSunEvent(s.sun.nextRiseUnixMillis, s.sun.nextSetUnixMillis);
      if (ev !== null) {
        document.getElementById("hero-k").textContent = ev.kind === "sunset" ? "Sunset in" : "Sunrise in";
        document.getElementById("hero-v").textContent = formatCountdown(ev.atUnixMillis - T);
      }
      document.getElementById("travelled").textContent = when === "feb"
        ? new Date(T).toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" }) : "";
      const sd = sunDay(T, LAT, LON);
      document.getElementById("sun-v").textContent = sd.riseUnixMillis === null ? "—" : `↑${fmt12(sd.riseUnixMillis)}`;
      document.getElementById("sun-s").textContent = sd.setUnixMillis === null ? "" : `↓${fmt12(sd.setUnixMillis)}`;
      const NAMES = ["new moon","waxing crescent","first quarter","waxing gibbous","full moon","waning gibbous","last quarter","waning crescent"];
      document.getElementById("moon-v").textContent = NAMES[Math.floor((s.moon.phaseAngleDeg / 360) * 8 + 0.5) % 8];
      const md = moonDay(T, LAT, LON);
      let mt = md.riseUnixMillis === null ? "no moonrise today" : `↑${fmt12c(md.riseUnixMillis)}`;
      if (md.riseUnixMillis !== null && md.setUnixMillis !== null) {
        const sD = new Date(md.setUnixMillis);
        const tag = sD.getDate() === new Date(T).getDate() ? "" : ` ${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][sD.getDay()]}`;
        mt += ` · ↓${fmt12c(md.setUnixMillis)}${tag}`;
      }
      document.getElementById("moon-s").textContent = mt;
      document.getElementById("clock").textContent = fmt12(T);
      document.getElementById("note").textContent = isDarkEnough(s.sun.altitudeDeg) ? "" : "visible after dark";

      const board = planetBoard(T, LAT, LON);
      const host = document.getElementById("rows");
      const line = (b) => {
        const next = b.upNow ? b.setUnixMillis : b.riseUnixMillis;
        let d = next === null ? "" : `${b.upNow ? "sets in" : "rises in"} ${formatCountdown(next - T)}`;
        if (b.upNow) d += ` · ${Math.round(b.altitudeDeg)}° ${compassAbbrev(b.azimuthDeg)}`;
        if (b.upNow && b.transitUnixMillis !== null && b.setUnixMillis !== null && b.transitUnixMillis < b.setUnixMillis) d += ` ⋆${fmt12c(b.transitUnixMillis)}`;
        return d;
      };
      const row = (name, d, up, color, chosen) => {
        const div = document.createElement("div");
        div.className = "lrow" + (up ? " is-up" : "") + (chosen ? " chosen" : "");
        const n = document.createElement("span"); n.className = "n";
        if (color) { const sw = document.createElement("i"); sw.className = "sw"; sw.style.background = color; n.appendChild(sw); n.style.color = color; }
        n.appendChild(document.createTextNode(name));
        if (D === "one" && color && !chosen) { const t = document.createElement("span"); t.className = "tap"; t.textContent = "tap to show"; n.appendChild(t); }
        const dd = document.createElement("span"); dd.className = "d"; dd.textContent = d;
        div.append(n, dd); host.appendChild(div);
      };
      // The ledger is the legend: whichever planets have arcs on the dial lead.
      const shown = D === "tonight" ? nightArcs.map((a) => a.name)
        : D === "all" ? ["Saturn", "Jupiter", "Mars"]
        : LIT ? [LIT, ...["Saturn", "Jupiter"].filter((n) => n !== LIT)]
        : D === "one" ? [CHOSEN, ...["Saturn", "Jupiter"].filter((n) => n !== CHOSEN)]
        : ["Saturn", "Jupiter"];
      for (const name of shown.slice(0, 3)) {
        const b = board.find((x) => x.name === name);
        if (b) row(b.name, line(b), b.upNow, PLANET_COLORS[b.name], D === "one" && name === CHOSEN);
      }
      const cons = tonightBoard(s.siderealHours + LON / 15, LAT, CONSTELLATIONS.filter((c) => c.notable === true)).filter((e) => e.status !== "never");
      for (const e of cons) {
        if (host.children.length >= 3) break;
        const c = formatCountdown(e.untilMillis ?? 0);
        row(e.constellation.name, e.status === "circumpolar" ? "up all night" : e.status === "up" ? `sets in ${c}` : `rises in ${c}`, e.status !== "down", null, false);
      }
    }
    document.fonts.ready.then(() => { buildGrain(ctx); render(); fillDom(); });
  </script>
</body>
</html>
