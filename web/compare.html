<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Day4 Observatory — WI-008 before / after</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--print-0:#081627;--print-1:#0E2440;--ink-hi:#D7E6F2;--ink-mid:#7E9CB8;--ink-low:#3A5876}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--print-0);color:var(--ink-hi);
    font-family:'IBM Plex Mono',monospace;padding:18px 24px}
  h1{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;
    font-size:26px;margin-bottom:2px}
  .sub{font-size:10px;letter-spacing:.2em;color:var(--ink-mid);margin-bottom:16px}
  .row{display:flex;gap:24px;justify-content:center;align-items:flex-start}
  .pane{background:radial-gradient(120% 120% at 50% 42%, var(--print-1) 0%, var(--print-0) 78%);
    border:1px solid var(--ink-low);padding:10px}
  .cap{font-size:10px;letter-spacing:.28em;color:var(--ink-mid);
    text-align:center;padding-bottom:8px}
  .cap b{color:var(--ink-hi);font-weight:500}
  canvas{display:block}
</style>
</head>
<body>
  <h1>WI-008 — before / after</h1>
  <div class="sub">IDENTICAL SKY STATE · 2026-08-17 14:30 LOCAL · 40.0°N 74.0°W</div>
  <div class="row">
    <div>
      <div class="cap">BEFORE <b>— v1 instrument</b></div>
      <div class="pane"><canvas id="before" width="1120" height="1120"
        style="width:560px;height:560px"></canvas></div>
    </div>
    <div>
      <div class="cap">AFTER <b>— consolidated research</b></div>
      <div class="pane"><canvas id="after" width="1120" height="1120"
        style="width:560px;height:560px"></canvas></div>
    </div>
  </div>
  <script type="module" src="/src/compare.ts"></script>
</body>
</html>
