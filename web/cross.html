<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day4 — the fiducial, six ways</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&display=swap" rel="stylesheet">
<style>
  :root{--field:#0E2440;--deep:#050F1E;--ink:#E7F0FA;--mid:#9BB9D6;--low:#46648A;
    --gold:#D9A62B;--gold-lit:#F7DE93}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--deep);color:var(--ink);font-family:"Fraunces",Georgia,serif;
    padding:22px 14px 60px}
  h1{font-family:"Cinzel",serif;font-size:13px;letter-spacing:.3em;text-indent:.3em;
    text-transform:uppercase;color:var(--gold);text-align:center;font-weight:600}
  .sub{text-align:center;color:var(--mid);font-size:14px;font-style:italic;
    margin:8px auto 24px;max-width:30rem;line-height:1.5}
  .card{max-width:520px;margin:0 auto 20px;border:1px solid rgba(217,166,43,.28);
    border-radius:3px;padding:14px 14px 12px;background:rgba(8,22,42,.5)}
  .name{font-family:"Cinzel",serif;font-size:12px;letter-spacing:.2em;text-indent:.2em;
    text-transform:uppercase;color:var(--gold-lit);font-weight:600;margin-bottom:3px}
  .why{font-size:13.5px;color:var(--mid);line-height:1.45;margin-bottom:11px}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .cell{text-align:center}
  .state{font-family:"Cinzel",serif;font-size:9.5px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--low);margin-top:5px}
  canvas{display:block;width:100%;height:auto;border-radius:2px}
  .true{margin-top:12px;padding-top:11px;border-top:1px solid rgba(70,100,138,.4);
    display:flex;align-items:center;gap:12px;justify-content:center}
  .true .state{margin:0}
</style>
</head>
<body>
<h1>The fiducial, six ways</h1>
<p class="sub">The mark that holds your present. Left: live, sitting with the sun.
Right: after time travel, holding the hour you are actually in.</p>
<div id="cards"></div>

<script>
const TAU = Math.PI * 2;
const hourAngle = (h) => (h / 24) * TAU + Math.PI / 2;
const NOW_H = 19.0;      // where the fiducial sits
const SUN_TRAVELLED = 23.0;

const GOLD_STOPS = [[0,"#FFF7DD"],[0.35,"#F7DE93"],[0.7,"#D9A62B"],[1,"#6E4E12"]];
function gold(ctx, y0, y1) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  for (const [at, c] of GOLD_STOPS) g.addColorStop(at, c);
  return g;
}

/* ————— the six marks —————
   Each is drawn in a frame already rotated upright on the band, with the
   band edge at y = +arm*1.35. `arm` is half the band width. */
const VARIANTS = [
  {
    name: "A · Latin cross",
    why: "What ships now: a plain upright with the long arm below. Unmistakably a cross, but it floats — nothing ties it to the hour it marks.",
    draw(ctx, arm, gilded) {
      ctx.beginPath();
      ctx.moveTo(0, -arm * 0.85); ctx.lineTo(0, arm * 1.35);
      ctx.moveTo(-arm * 0.6, -arm * 0.2); ctx.lineTo(arm * 0.6, -arm * 0.2);
      ctx.stroke();
    },
  },
  {
    name: "B · Cross fitchy",
    why: "The heraldic cross with a pointed foot — made to be planted in the ground. The point lands on the band, so the mark says exactly which minute is yours.",
    draw(ctx, arm, gilded) {
      ctx.beginPath();
      ctx.moveTo(0, -arm * 0.9); ctx.lineTo(0, arm * 0.8);
      ctx.moveTo(-arm * 0.58, -arm * 0.25); ctx.lineTo(arm * 0.58, -arm * 0.25);
      ctx.stroke();
      // the spike
      ctx.beginPath();
      ctx.moveTo(-arm * 0.22, arm * 0.75);
      ctx.lineTo(0, arm * 1.7);
      ctx.lineTo(arm * 0.22, arm * 0.75);
      ctx.closePath();
      ctx.fill();
    },
  },
  {
    name: "C · Cross in a roundel",
    why: "A seal: the cross reversed out of a filled disc. The strongest presence at a glance, but it competes with the sun for weight.",
    draw(ctx, arm, gilded) {
      const r = arm * 0.92;
      ctx.save();
      ctx.fillStyle = ctx.strokeStyle;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = "destination-out";
      ctx.lineWidth = r * 0.30; ctx.strokeStyle = "#000";
      ctx.beginPath();
      ctx.moveTo(0, -r * 0.62); ctx.lineTo(0, r * 0.66);
      ctx.moveTo(-r * 0.5, -r * 0.08); ctx.lineTo(r * 0.5, -r * 0.08);
      ctx.stroke();
      ctx.restore();
    },
  },
  {
    name: "D · Greek cross",
    why: "Equal arms, no direction. Compact and calm at true size, and it reads as an instrument index rather than an emblem — but it loses the Latin form.",
    draw(ctx, arm, gilded) {
      ctx.beginPath();
      ctx.moveTo(0, -arm * 0.78); ctx.lineTo(0, arm * 0.78);
      ctx.moveTo(-arm * 0.78, 0); ctx.lineTo(arm * 0.78, 0);
      ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, arm * 0.24, 0, TAU); ctx.stroke();
    },
  },
  {
    name: "E · Cross on a stem",
    why: "A surveyor's mark: a fine stem runs from the cross down across the band, cutting the exact hour. The cross stays clear of the sun; the stem does the pointing.",
    draw(ctx, arm, gilded) {
      ctx.save();
      ctx.lineWidth = Math.max(1, ctx.lineWidth * 0.55);
      ctx.beginPath(); ctx.moveTo(0, arm * 0.55); ctx.lineTo(0, arm * 3.0); ctx.stroke();
      ctx.restore();
      ctx.beginPath();
      ctx.moveTo(0, -arm * 0.95); ctx.lineTo(0, arm * 0.6);
      ctx.moveTo(-arm * 0.62, -arm * 0.28); ctx.lineTo(arm * 0.62, -arm * 0.28);
      ctx.stroke();
    },
  },
  {
    name: "F · Cross and chevron",
    why: "The cross rides above, a gold chevron notches the band edge beneath it. Two marks, two jobs: the symbol above, the precision below.",
    draw(ctx, arm, gilded) {
      ctx.beginPath();
      ctx.moveTo(0, -arm * 1.15); ctx.lineTo(0, arm * 0.35);
      ctx.moveTo(-arm * 0.55, -arm * 0.5); ctx.lineTo(arm * 0.55, -arm * 0.5);
      ctx.stroke();
      ctx.save();
      ctx.fillStyle = ctx.strokeStyle;
      ctx.beginPath();
      ctx.moveTo(-arm * 0.42, arm * 1.62);
      ctx.lineTo(0, arm * 0.95);
      ctx.lineTo(arm * 0.42, arm * 1.62);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    },
  },
  {
    name: "G · Upright cross, radial tick",
    why: "The synthesis. Upright keeps the symbol; a separate hairline, drawn along the radius, does the pointing. The cross never turns, and the hour is still cut exactly — the only version that keeps both.",
    radialTick: true,
    draw(ctx, arm, gilded) {
      ctx.beginPath();
      ctx.moveTo(0, -arm * 1.0); ctx.lineTo(0, arm * 0.9);
      ctx.moveTo(-arm * 0.6, -arm * 0.32); ctx.lineTo(arm * 0.6, -arm * 0.32);
      ctx.stroke();
    },
  },
];

/* ————— a real slice of the gilded dial ————— */
function drawScene(canvas, variant, gilded, zoom, w, h, opts) {
  const upright = opts?.upright === true;
  const nowH = opts?.nowH ?? NOW_H;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(w * dpr); canvas.height = Math.floor(h * dpr);
  canvas.style.height = h + "px";
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#0B1E38"; ctx.fillRect(0, 0, w, h);

  // A phone-sized dial: this is the scale the mark actually lives at.
  const DIAL = 340;
  const R = DIAL * 0.5 * 0.92;
  const rOut = R * 0.985, rIn = R * 0.875;
  const band = rOut - rIn;
  const a = hourAngle(nowH);
  const markR = rOut + band * (variant.radialTick === true ? 1.05 : 0.62);
  const px = Math.cos(a) * markR, py = Math.sin(a) * markR;

  ctx.translate(w / 2, h / 2);
  ctx.scale(zoom, zoom);
  ctx.translate(-px, -py);

  // band: night below the horizon crossing, day above, amber between
  const SEG = 240;
  for (let i = 0; i < SEG; i++) {
    const h0 = (i / SEG) * 24, h1 = ((i + 1) / SEG) * 24, mid = (h0 + h1) / 2;
    const day = mid > 5.2 && mid < 18.8;
    const dT = Math.min(Math.abs(mid - 5.2), Math.abs(mid - 18.8));
    const t = Math.max(0, 1 - dT / 1.15) ** 1.4;
    const base = day ? [30, 66, 112] : [10, 27, 51];
    const amber = [206, 122, 58];
    ctx.fillStyle = `rgb(${Math.round(base[0] + (amber[0] - base[0]) * t)},${
      Math.round(base[1] + (amber[1] - base[1]) * t)},${
      Math.round(base[2] + (amber[2] - base[2]) * t)})`;
    ctx.beginPath();
    ctx.arc(0, 0, rOut, hourAngle(h0), hourAngle(h1));
    ctx.arc(0, 0, rIn, hourAngle(h1), hourAngle(h0), true);
    ctx.closePath(); ctx.fill();
  }
  ctx.lineWidth = 1.3;
  for (const r of [rOut, rIn]) {
    ctx.strokeStyle = gold(ctx, -r, r);
    ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
  }
  // hour ticks, so the mark is judged against real neighbours
  for (let i = 0; i < 48; i++) {
    const ang = hourAngle(i / 2), major = i % 12 === 0, hourly = i % 2 === 0;
    const r1 = major ? rIn - R * 0.012 : hourly ? rOut - band * 0.5 : rOut - band * 0.25;
    ctx.beginPath();
    ctx.moveTo(Math.cos(ang) * r1, Math.sin(ang) * r1);
    ctx.lineTo(Math.cos(ang) * rOut, Math.sin(ang) * rOut);
    ctx.lineWidth = major ? 1.4 : hourly ? 1.0 : 0.75;
    ctx.strokeStyle = major ? gold(ctx, -rOut, rOut) : hourly ? "#9BB9D6" : "#46648A";
    ctx.stroke();
  }

  // the sun: under the mark when live, four hours away once travelled
  const sunH = gilded ? nowH + 4 : nowH;
  const sa = hourAngle(sunH), sr = (rOut + rIn) / 2;
  const sx = Math.cos(sa) * sr, sy = Math.sin(sa) * sr, rS = R * 0.03;
  const sg = ctx.createRadialGradient(sx - rS * 0.35, sy - rS * 0.45, 0, sx, sy, rS);
  sg.addColorStop(0, "#FFF7DD"); sg.addColorStop(0.45, "#F7DE93");
  sg.addColorStop(0.85, "#D9A62B"); sg.addColorStop(1, "#8A6416");
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(sx, sy, rS, 0, TAU); ctx.fill();

  // A radial tick belongs to the dial, not to the symbol: draw it before the
  // frame is turned upright, so it always follows the radius.
  if (variant.radialTick === true) {
    const t0 = rIn + band * 0.15, t1 = rOut + band * 0.30;
    ctx.save();
    ctx.lineWidth = gilded ? 1.6 : 1.1;
    ctx.strokeStyle = gilded ? "#F0B310" : "#E7F0FA";
    ctx.globalAlpha = gilded ? 0.95 : 0.6;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * t0, Math.sin(a) * t0);
    ctx.lineTo(Math.cos(a) * t1, Math.sin(a) * t1);
    ctx.stroke();
    ctx.restore();
  }

  // the mark itself
  ctx.save();
  ctx.translate(px, py);
  // Radial keeps the mark square to the band; upright keeps it square to the
  // reader. A Latin cross turned on its side stops being a cross.
  if (!upright) ctx.rotate(a + Math.PI / 2);
  ctx.lineCap = "round";
  ctx.lineWidth = gilded ? 2 : 1.4;
  ctx.strokeStyle = gilded ? "#F0B310" : "#E7F0FA";
  ctx.globalAlpha = gilded ? 0.95 : 0.55;
  variant.draw(ctx, band * 0.5, gilded);
  ctx.restore();
}

const host = document.getElementById("cards");

// The finding that matters most: at 06:00 and 18:00 a radial cross lies flat.
const latin = VARIANTS[0];
const orient = document.createElement("div");
orient.className = "card";
orient.innerHTML = `
  <div class="name">First, the orientation</div>
  <div class="why">The same cross at 06:00. Turned square to the band it lies on
  its side and reads as a dagger; held square to the reader it stays a cross at
  every hour of the day. Every shape below is drawn upright.</div>
  <div class="pair">
    <div class="cell"><canvas></canvas><div class="state">Radial — ships today</div></div>
    <div class="cell"><canvas></canvas><div class="state">Upright</div></div>
  </div>`;
host.appendChild(orient);
{
  const [radial, up] = orient.querySelectorAll("canvas");
  drawScene(radial, latin, true, 3.4, 240, 150, { nowH: 6, upright: false });
  drawScene(up, latin, true, 3.4, 240, 150, { nowH: 6, upright: true });
}
for (const v of VARIANTS) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div class="name">${v.name}</div>
    <div class="why">${v.why}</div>
    <div class="pair">
      <div class="cell"><canvas></canvas><div class="state">Live</div></div>
      <div class="cell"><canvas></canvas><div class="state">Travelled</div></div>
    </div>
    <div class="true"><canvas style="width:150px"></canvas><div class="state">True size</div></div>`;
  host.appendChild(card);
  const [live, travelled, trueSize] = card.querySelectorAll("canvas");
  drawScene(live, v, false, 3.4, 240, 150, { upright: true });
  drawScene(travelled, v, true, 3.4, 240, 150, { upright: true });
  drawScene(trueSize, v, true, 1, 150, 92, { upright: true });
}
</script>
</body>
</html>
