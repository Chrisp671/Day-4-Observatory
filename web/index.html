<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Day4 Observatory</title>
  <meta name="theme-color" content="#0E2440">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant:ital,wght@0,500;0,600;1,500;1,600&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root{
      --print-0:#081627; --print-1:#0E2440;
      --ink-hi:#D7E6F2; --ink-mid:#7E9CB8; --ink-low:#3A5876;
      --sunlight:#F0B310;
      --serif:'Cormorant', Georgia, serif;
      --caps:'Cinzel', 'Times New Roman', serif;
      --mono:'IBM Plex Mono', ui-monospace, monospace;
      --pad: clamp(16px, 3vw, 40px);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    #firmament{position:fixed;inset:0;width:100vw;height:100dvh;z-index:-1;
      pointer-events:none}
    html,body{height:100%}
    body{
      background:radial-gradient(125% 125% at 50% 45%, var(--print-1) 0%, var(--print-0) 80%);
      color:var(--ink-hi); font-family:var(--mono);
      display:flex; flex-direction:column; height:100dvh; overflow:hidden;
    }

    /* ————— masthead: the verse the instrument hangs under ————— */
    .masthead{flex:none;text-align:center;
      padding:clamp(10px,1.8vh,20px) var(--pad) 0}
    .verse{font-family:var(--serif);font-style:italic;font-weight:600;
      font-size:clamp(16px,2.5vh,23px);line-height:1.35;color:var(--ink-hi);
      max-width:62ch;margin:0 auto;text-wrap:balance}
    .verse-ref{font-family:var(--caps);font-weight:600;font-size:10px;
      letter-spacing:.4em;text-transform:uppercase;color:var(--ink-mid);
      margin-top:clamp(4px,0.9vh,9px)}

    /* ————— header ————— */
    header{display:flex;justify-content:space-between;align-items:center;
      gap:16px; padding:clamp(8px,1.4vh,16px) var(--pad) 0; flex:none;
      position:relative}
    .hero{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
      display:flex;align-items:baseline;gap:.45em;justify-content:center;
      pointer-events:none;white-space:nowrap}
    .hero span{font-family:var(--serif);font-style:italic;font-weight:600;
      font-size:clamp(22px,3.4vh,32px);color:var(--ink-hi);line-height:1.05}
    .hero b{font-family:var(--mono);font-weight:500;font-style:normal;
      font-size:clamp(20px,3.1vh,29px);color:var(--sunlight);
      letter-spacing:.01em;line-height:1.05;font-variant-numeric:tabular-nums}
    .brand{display:flex;align-items:center;gap:.55em;min-width:0}
    .brand img{height:clamp(22px,3.4vh,34px);display:block}
    .brand span{font-family:var(--serif);font-style:italic;
      font-size:clamp(19px,2.9vh,30px);color:var(--ink-hi);
      letter-spacing:.01em;white-space:nowrap}
    .clockline{font-size:clamp(10px,1.5vh,13px);letter-spacing:.14em;
      color:var(--ink-mid);font-weight:300;white-space:nowrap}
    .clockline .date{font-family:var(--caps);font-weight:500;font-size:.9em;
      letter-spacing:.2em}
    .clockline b{color:var(--ink-hi);font-weight:500;font-size:1.15em}
    .clockline b.shifted{color:var(--sunlight)}

    /* ————— stage: dial centred, readouts in the corners ————— */
    .stage{position:relative;flex:1;min-height:0;display:grid;place-items:center;
      padding:clamp(8px,1.6vh,18px) var(--pad)}
    canvas{display:block;touch-action:none}
    .readout{position:absolute;pointer-events:none;max-width:38%}
    .readout .k{font-family:var(--caps);font-weight:600;font-size:10px;
      letter-spacing:.26em;color:var(--ink-mid)}
    .readout .v{font-size:clamp(15px,2.4vh,22px);letter-spacing:.02em;
      margin-top:3px;color:var(--ink-hi);line-height:1.15}
    .r-tl{top:clamp(8px,3vh,30px);left:var(--pad)}
    .r-tr{top:clamp(8px,3vh,30px);right:var(--pad);text-align:right}
    .r-bl{bottom:clamp(8px,2vh,20px);left:var(--pad)}
    .r-br{bottom:clamp(8px,2vh,20px);right:var(--pad);text-align:right;pointer-events:auto}

    /* station entry lives with the station readout */
    .stationbar{display:flex;gap:4px;justify-content:flex-end;margin-top:7px;flex-wrap:wrap}
    .stationbar input{font-family:var(--mono);font-size:11px;width:66px;text-align:right;
      color:var(--ink-hi);background:transparent;border:1px solid var(--ink-low);
      padding:3px 5px}
    .stationbar input:focus{border-color:var(--ink-mid);outline:none}
    .stationbar button{font-family:var(--caps);font-weight:600;font-size:9px;
      letter-spacing:.14em;
      color:var(--ink-mid);background:transparent;border:1px solid var(--ink-low);
      padding:3px 7px;cursor:pointer}
    .stationbar button:hover{color:var(--ink-hi);border-color:var(--ink-mid)}
    #station-status{display:block;margin-top:5px;font-size:9px;letter-spacing:.1em;
      color:var(--sunlight)}

    /* ————— time travel ————— */
    .controls{flex:none;display:flex;justify-content:center;align-items:center;
      gap:6px;flex-wrap:wrap;padding:0 var(--pad) clamp(6px,1.2vh,12px)}
    .stepper{display:flex;align-items:stretch;border:1px solid var(--ink-low)}
    .stepper span{font-family:var(--caps);font-weight:600;font-size:9px;
      letter-spacing:.14em;color:var(--ink-mid);
      padding:6px 7px;align-self:center;min-width:44px;text-align:center}
    .stepper button{font-family:var(--mono);font-size:13px;line-height:1;
      color:var(--ink-mid);background:transparent;border:none;
      padding:6px 9px;cursor:pointer}
    .stepper button:hover{color:var(--ink-hi);background:rgba(215,230,242,.07)}
    #now{font-family:var(--caps);font-weight:600;font-size:10px;letter-spacing:.18em;
      color:var(--ink-hi);background:transparent;border:1px solid var(--ink-low);
      padding:7px 16px;cursor:pointer;margin-left:6px}
    #now:hover{border-color:var(--ink-mid)}
    #now.armed{color:var(--sunlight);border-color:var(--sunlight)}

    @media (max-width:720px){
      /* Portrait is a STACK: logo, hero, dial with air, data grid, controls.
         Nothing is absolutely positioned; nothing can overlap. */
      body{overflow-y:auto;height:auto;min-height:100dvh}
      .masthead{padding:16px 20px 0}
      .verse{font-size:15px;line-height:1.4}
      .verse-ref{font-size:9px;letter-spacing:.32em}
      header{flex-direction:column;gap:2px;padding-top:10px}
      .hero{position:static;transform:none;width:100%;margin-top:4px}
      .clockline{display:none}
      .stage{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;
        place-items:stretch;padding:10px 16px 4px}
      .stage canvas{grid-column:1/-1;justify-self:center;margin-bottom:12px}
      .readout{position:static;max-width:none;pointer-events:auto;
        padding:7px 0;border-top:1px solid var(--ink-low)}
      .r-tl{order:1}.r-tr{order:2}.r-bl{order:3}.r-br{order:4}
      .controls{padding:10px var(--pad) 8px}
      #now{margin-left:0}
      .stepper span{min-width:38px;letter-spacing:.1em}
      .stepper button{padding:6px 7px}
    }
    :focus-visible{outline:2px solid var(--sunlight);outline-offset:2px}
  </style>
</head>
<body>
  <canvas id="firmament" aria-hidden="true"></canvas>
  <div class="masthead">
    <p class="verse">&ldquo;<span id="verse-text">And let them be for signs and for seasons, and for days and years.</span>&rdquo;</p>
    <div class="verse-ref" id="verse-ref">Genesis 1:14 &middot; ESV</div>
  </div>
  <header>
    <div class="brand">
      <img src="day4-logo-dark.png" alt="Day4 Astronomy Observatory">
    </div>
    <div class="hero"><span id="hero-k">—</span><b id="hero-v"></b></div>
    <div class="clockline"><span class="date" id="dateline">—</span> &nbsp; <b id="timeline">—</b></div>
  </header>

  <div class="stage">
    <div class="readout r-tl"><div class="k">SUNRISE</div><div class="v" id="rise">—</div></div>
    <div class="readout r-tr"><div class="k">SUNSET</div><div class="v" id="set">—</div></div>
    <canvas id="sky" role="img"
      aria-label="Live astronomical dial: the sun rides a 24-hour ring showing day, night, and the current time"></canvas>
    <div class="readout r-bl"><div class="k">MOON</div><div class="v" id="moon">—</div></div>
    <div class="readout r-br">
      <div class="k">STATION</div><div class="v" id="station">—</div>
      <div class="stationbar">
        <input id="lat-in" inputmode="decimal" autocomplete="off" aria-label="Latitude">
        <input id="lon-in" inputmode="decimal" autocomplete="off" aria-label="Longitude">
        <button id="set-station">SET</button>
        <button id="locate">LOCATE</button>
      </div>
      <span id="station-status"></span>
    </div>
  </div>

  <div class="controls" role="group" aria-label="Time travel">
    <div id="steppers" style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center"></div>
    <button id="now" aria-label="Return to the present">NOW</button>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
