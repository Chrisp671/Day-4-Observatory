<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Day4 Observatory</title>
  <meta name="theme-color" content="#0E2440">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant:ital,wght@0,500;0,600;1,500;1,600&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root{
      --print-0:#081627; --print-1:#0E2440;
      --ink-hi:#E7F0FA; --ink-mid:#9BB9D6; --ink-low:#46648A;
      --sunlight:#F0B310;
      --scripture:#F3ECDA; --gold-soft:#E7BE5A;
      --serif:'Cormorant', Georgia, serif;
      --caps:'Cinzel', 'Times New Roman', serif;
      --mono:'IBM Plex Mono', ui-monospace, monospace;
      --pad: clamp(16px, 3vw, 40px);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    #firmament{position:fixed;inset:0;width:100vw;height:100dvh;z-index:-1;
      pointer-events:none}
    html,body{height:100%}
    body{
      background:radial-gradient(125% 125% at 50% 45%, var(--print-1) 0%, var(--print-0) 80%);
      color:var(--ink-hi); font-family:var(--mono);
      display:flex; flex-direction:column; height:100dvh; overflow:hidden;
    }

    /* ————— header: logo, then the Word, then the light (one column) —————
       Warm light for scripture, cool light for the instrument: the ivory
       and gold masthead reads first against the cool field. */
    header{display:flex;flex-direction:column;align-items:center;
      gap:clamp(5px,1vh,11px);padding:clamp(12px,2vh,24px) var(--pad) 0;
      flex:none;position:relative}
    .brand img{height:clamp(30px,4.6vh,46px);display:block;
      filter:drop-shadow(0 2px 10px rgba(4,10,22,.6))}
    .masthead{text-align:center}
    .verse{font-family:var(--serif);font-style:italic;font-weight:700;
      font-size:clamp(17px,2.7vh,25px);line-height:1.35;color:var(--scripture);
      max-width:58ch;margin:0 auto;text-wrap:balance;
      text-shadow:0 1px 14px rgba(4,10,22,.85)}
    .verse-ref{font-family:var(--caps);font-weight:700;font-size:10.5px;
      letter-spacing:.34em;text-transform:uppercase;color:var(--gold-soft);
      margin-top:clamp(4px,0.9vh,9px);text-shadow:0 1px 10px rgba(4,10,22,.8)}
    .hero{display:flex;align-items:baseline;gap:.45em;justify-content:center;
      pointer-events:none;white-space:nowrap;
      text-shadow:0 1px 12px rgba(4,10,22,.75)}
    .hero span{font-family:var(--serif);font-style:italic;font-weight:700;
      font-size:clamp(22px,3.4vh,32px);color:var(--ink-hi);line-height:1.05}
    .hero b{font-family:var(--mono);font-weight:500;font-style:normal;
      font-size:clamp(20px,3.1vh,29px);color:var(--sunlight);
      letter-spacing:.01em;line-height:1.05;font-variant-numeric:tabular-nums}
    .clockline{position:absolute;top:clamp(12px,2vh,24px);right:var(--pad);
      font-size:clamp(10px,1.5vh,13px);letter-spacing:.14em;
      color:var(--ink-mid);font-weight:300;white-space:nowrap}
    .clockline .date{font-family:var(--caps);font-weight:600;font-size:.9em;
      letter-spacing:.2em}
    .clockline b{color:var(--ink-hi);font-weight:500;font-size:1.15em}
    .clockline b.shifted{color:var(--sunlight)}
    .clockline .zone{font-family:var(--caps);font-weight:600;font-size:.82em;
      letter-spacing:.16em;color:var(--ink-mid)}
    .zone-note{position:absolute;top:calc(clamp(12px,2vh,24px) + 1.5em);right:var(--pad);
      font-family:var(--serif);font-style:italic;font-size:12.5px;color:var(--gold-soft);
      white-space:nowrap}
    .zone-note:empty{display:none}

    /* ————— stage: dial centred, readouts in the corners ————— */
    .stage{position:relative;flex:1;min-height:0;display:grid;place-items:center;
      padding:clamp(8px,1.6vh,18px) var(--pad)}
    canvas{display:block;touch-action:none}
    .readout{position:absolute;pointer-events:none;max-width:38%}
    .readout .k{font-family:var(--caps);font-weight:700;font-size:10px;
      letter-spacing:.26em;color:var(--ink-mid)}
    .readout .v{font-size:clamp(15px,2.4vh,22px);letter-spacing:.02em;
      margin-top:3px;color:var(--ink-hi);line-height:1.15}
    .r-tl{top:clamp(8px,3vh,30px);left:var(--pad)}
    .r-tr{top:clamp(8px,3vh,30px);right:var(--pad);text-align:right}
    .r-bl{bottom:clamp(8px,2vh,20px);left:var(--pad)}
    .r-br{bottom:clamp(8px,2vh,20px);right:var(--pad);text-align:right;pointer-events:auto}

    /* Station entry hides behind the coordinates: the readout is the
       control. Tap the coordinates to open it; it closes on success. */
    .station-toggle{font-family:var(--mono);background:transparent;border:none;
      cursor:pointer;padding:0;text-align:right;width:100%;
      border-bottom:1px dotted transparent}
    .station-toggle:hover{border-bottom-color:var(--ink-mid)}
    .stationbar{display:none;gap:4px;justify-content:flex-end;margin-top:7px;flex-wrap:wrap}
    .r-br.open .stationbar{display:flex}
    .stationbar input{font-family:var(--mono);font-size:11px;width:66px;text-align:right;
      color:var(--ink-hi);background:transparent;border:1px solid var(--ink-low);
      padding:3px 5px}
    .stationbar input:focus{border-color:var(--ink-mid);outline:none}
    .stationbar button{font-family:var(--caps);font-weight:600;font-size:9px;
      letter-spacing:.14em;
      color:var(--ink-mid);background:transparent;border:1px solid var(--ink-low);
      padding:3px 7px;cursor:pointer}
    .stationbar button:hover{color:var(--ink-hi);border-color:var(--ink-mid)}
    #station-status{display:block;margin-top:5px;font-size:9px;letter-spacing:.1em;
      color:var(--sunlight)}

    /* ————— time travel ————— */
    .controls{flex:none;display:flex;justify-content:center;align-items:center;
      gap:6px;flex-wrap:wrap;padding:0 var(--pad) clamp(6px,1.2vh,12px)}
    .stepper{display:flex;align-items:stretch;border:1px solid var(--ink-low)}
    .stepper span{font-family:var(--caps);font-weight:600;font-size:9px;
      letter-spacing:.14em;color:var(--ink-mid);
      padding:6px 7px;align-self:center;min-width:44px;text-align:center}
    .stepper button{font-family:var(--mono);font-size:13px;line-height:1;
      color:var(--ink-mid);background:transparent;border:none;
      padding:6px 9px;cursor:pointer}
    .stepper button:hover{color:var(--ink-hi);background:rgba(215,230,242,.07)}
    #now{font-family:var(--caps);font-weight:600;font-size:10px;letter-spacing:.18em;
      color:var(--ink-hi);background:transparent;border:1px solid var(--ink-low);
      padding:7px 16px;cursor:pointer;margin-left:6px}
    #now:hover{border-color:var(--ink-mid)}
    #now.armed{color:var(--sunlight);border-color:var(--sunlight)}

    /* the hours of Mark 15:33, named beneath the dial */
    .passion{flex:none;text-align:center;padding:0 var(--pad) clamp(4px,0.8vh,9px);
      font-family:var(--caps);font-weight:600;font-size:10px;letter-spacing:.2em;
      color:var(--gold-soft)}
    .passion:empty{display:none}

    /* ————— tonight: the evening's program ————— */
    .tonight{flex:none;padding:clamp(8px,1.4vh,14px) var(--pad) clamp(10px,1.6vh,18px);
      border-top:1px solid var(--ink-low)}
    .tonight-h{display:flex;align-items:baseline;gap:.6em;justify-content:center;
      margin-bottom:clamp(6px,1vh,10px)}
    .tonight-h span{font-family:var(--caps);font-weight:700;font-size:10px;
      letter-spacing:.34em;color:var(--ink-mid)}
    .tonight-h em{font-family:var(--serif);font-style:italic;font-weight:600;
      font-size:13.5px;color:var(--ink-mid)}
    .tonight-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));
      gap:4px clamp(10px,2vw,26px);max-width:1100px;margin:0 auto}
    .sky-item{text-align:center;min-width:0}
    .sky-name{font-family:var(--caps);font-weight:600;font-size:11px;
      letter-spacing:.16em;color:var(--ink-mid);white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis}
    .sky-when{font-family:var(--mono);font-size:12px;color:var(--ink-mid);
      font-variant-numeric:tabular-nums;margin-top:2px}
    .sky-item.is-up .sky-name{color:var(--scripture)}
    .sky-item.is-up .sky-when{color:var(--ink-hi)}

    @media (max-width:720px){
      /* Portrait is a STACK: logo, hero, dial with air, data grid, controls.
         Nothing is absolutely positioned; nothing can overlap. */
      body{overflow-y:auto;height:auto;min-height:100dvh}
      header{gap:7px;padding-top:16px}
      .brand img{height:34px}
      .verse{font-size:16px;line-height:1.4;padding:0 4px}
      .verse-ref{font-size:9.5px;letter-spacing:.3em}
      .clockline{display:none}
      .zone-note{position:static;text-align:center;white-space:normal;font-size:12px}
      .stage{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;
        place-items:stretch;padding:10px 16px 4px}
      .stage canvas{grid-column:1/-1;justify-self:center;margin-bottom:12px}
      .readout{position:static;max-width:none;pointer-events:auto;
        padding:7px 0;border-top:1px solid var(--ink-low)}
      .r-tl{order:1}.r-tr{order:2}.r-bl{order:3}.r-br{order:4}
      .controls{padding:10px var(--pad) 8px}
      #now{margin-left:0}
      .stepper span{min-width:38px;letter-spacing:.1em}
      .stepper button{padding:6px 7px}
      .tonight{padding-bottom:20px}
      .tonight-list{grid-template-columns:repeat(2,1fr);gap:8px 14px}
      .tonight-h em{font-size:12px}
    }
    .sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;
      overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
    :focus-visible{outline:2px solid var(--sunlight);outline-offset:2px}
  </style>
</head>
<body>
  <canvas id="firmament" aria-hidden="true"></canvas>
  <header>
    <div class="brand">
      <img src="day4-logo-dark.png" alt="Day4 Astronomy Observatory">
    </div>
    <div class="masthead">
      <p class="verse">&ldquo;<span id="verse-text">And let them be for signs and for seasons, and for days and years.</span>&rdquo;</p>
      <div class="verse-ref" id="verse-ref">Genesis 1:14 &middot; ESV</div>
    </div>
    <div class="hero"><span id="hero-k">—</span><b id="hero-v"></b></div>
    <div class="clockline"><span class="date" id="dateline">—</span> &nbsp; <b id="timeline">—</b> <span class="zone" id="zone"></span></div>
    <div class="zone-note" id="zone-note"></div>
  </header>

  <div class="stage">
    <div class="readout r-tl"><div class="k">SUNRISE</div><div class="v" id="rise">—</div></div>
    <div class="readout r-tr"><div class="k">SUNSET</div><div class="v" id="set">—</div></div>
    <canvas id="sky" role="img" aria-describedby="sky-transcript"
      aria-label="Live astronomical dial: the sun rides a 24-hour ring showing day, night, and the current time"></canvas>
    <p id="sky-transcript" class="sr-only"></p>
    <div class="readout r-bl"><div class="k">MOON</div><div class="v" id="moon">—</div></div>
    <div class="readout r-br">
      <div class="k">STATION</div>
      <button class="v station-toggle" id="station" aria-expanded="false"
        aria-controls="stationbar" title="Change station">—</button>
      <div class="stationbar" id="stationbar">
        <input id="lat-in" inputmode="decimal" autocomplete="off" aria-label="Latitude">
        <input id="lon-in" inputmode="decimal" autocomplete="off" aria-label="Longitude">
        <button id="set-station">SET</button>
        <button id="locate">LOCATE</button>
      </div>
      <span id="station-status"></span>
    </div>
  </div>

  <div class="controls" role="group" aria-label="Time travel">
    <div id="steppers" style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center"></div>
    <button id="now" aria-label="Return to the present">NOW</button>
  </div>
  <div class="passion" id="passion"></div>
  <section class="tonight" aria-label="Constellations tonight">
    <div class="tonight-h"><span>TONIGHT</span><em id="tonight-note"></em></div>
    <div class="tonight-list" id="tonight-list"></div>
  </section>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
