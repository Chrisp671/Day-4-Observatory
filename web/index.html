<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Day4 Observatory</title>
  <meta name="theme-color" content="#0E2440">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root{
      --print-0:#081627; --print-1:#0E2440;
      --ink-hi:#D7E6F2; --ink-mid:#7E9CB8; --ink-low:#3A5876;
      --sunlight:#F0B310;
      --serif:'Instrument Serif', Georgia, serif;
      --mono:'IBM Plex Mono', ui-monospace, monospace;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      background:radial-gradient(120% 120% at 50% 42%, var(--print-1) 0%, var(--print-0) 78%);
      color:var(--ink-hi); font-family:var(--mono);
      display:flex; flex-direction:column; min-height:100dvh; overflow:hidden;
    }
    header{display:flex;justify-content:space-between;align-items:center;
      padding:clamp(14px,2.4vh,28px) clamp(18px,3vw,40px) 0}
    .wordmark{font-family:var(--serif);font-style:italic;
      font-size:clamp(22px,3.2vh,34px);display:flex;align-items:center;gap:.5em}
    /* Maker's cartouche: the brand mark mounted as a pasted paper label,
       the way an engraved chart carries its publisher. Warm paper, never
       pure white; hairline ink border; sits ON the print, not in it. */
    .plate{height:clamp(26px,4.2vh,40px);display:block;
      padding:4px 7px;background:#F0EAD6;
      border:1px solid var(--ink-low);
      box-shadow:0 1px 0 rgba(8,22,39,.55)}
    .clockline{font-size:clamp(10px,1.5vh,13px);letter-spacing:.14em;
      color:var(--ink-mid);font-weight:300}
    .clockline b{color:var(--ink-hi);font-weight:500}
    main{flex:1;display:grid;place-items:center;min-height:0;padding:0 12px}
    canvas{display:block;max-width:100%;max-height:100%}
    footer{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;
      border:1px solid var(--ink-low);background:var(--ink-low);
      margin:0 clamp(18px,3vw,40px) clamp(10px,1.8vh,20px)}
    .cell{background:var(--print-0);padding:10px 14px 12px}
    .cell .k{font-size:9px;letter-spacing:.28em;color:var(--ink-mid);font-weight:300}
    .cell .v{font-size:clamp(12px,1.9vh,16px);letter-spacing:.06em;margin-top:4px}
    .note{padding:0 clamp(18px,3vw,40px) 10px;font-size:9px;letter-spacing:.2em;
      color:var(--ink-low);text-align:center}
    .controls{display:flex;justify-content:center;align-items:center;gap:8px;
      flex-wrap:wrap;padding:4px clamp(18px,3vw,40px) 10px}
    .stepgroup{display:flex;gap:2px}
    .controls button{
      font-family:var(--mono);font-size:10px;letter-spacing:.08em;
      color:var(--ink-mid);background:transparent;
      border:1px solid var(--ink-low);padding:5px 7px;cursor:pointer}
    .controls button:hover{color:var(--ink-hi);border-color:var(--ink-mid)}
    .controls #now{color:var(--ink-hi);padding:5px 14px}
    .controls #now.armed{color:var(--sunlight);border-color:var(--sunlight)}
    .timeline.shifted, #timeline.shifted{color:var(--sunlight)}
    .stationbar{display:flex;justify-content:center;align-items:center;gap:6px;
      padding:0 clamp(18px,3vw,40px) 8px;font-size:10px;color:var(--ink-mid)}
    .stationbar input{
      font-family:var(--mono);font-size:11px;width:90px;
      color:var(--ink-hi);background:transparent;
      border:1px solid var(--ink-low);padding:4px 6px}
    .stationbar button{
      font-family:var(--mono);font-size:10px;letter-spacing:.08em;
      color:var(--ink-mid);background:transparent;
      border:1px solid var(--ink-low);padding:4px 8px;cursor:pointer}
    .stationbar button:hover{color:var(--ink-hi);border-color:var(--ink-mid)}
    #station-status{color:var(--sunlight);letter-spacing:.06em}
    @media (max-width:560px){
      footer{grid-template-columns:repeat(2,1fr)}
      .clockline span.date{display:none}
      .stepgroup button{padding:4px 4px}
    }
    :focus-visible{outline:2px solid var(--sunlight);outline-offset:3px}
  </style>
</head>
<body>
  <header>
    <div class="wordmark"><img class="plate" src="day4-logo.png" alt="Day4 Astronomy">Observatory</div>
    <div class="clockline"><span class="date" id="dateline">—</span> &nbsp; <b id="timeline">—</b></div>
  </header>
  <main>
    <canvas id="sky" role="img"
      aria-label="Live astronomical dial: the sun rides a 24-hour ring showing day, night, and the current time"></canvas>
  </main>
  <div class="controls" role="group" aria-label="Time travel">
    <div class="stepgroup" id="back"></div>
    <button id="now" aria-label="Return to the present">NOW</button>
    <div class="stepgroup" id="fwd"></div>
  </div>
  <div class="stationbar" role="group" aria-label="Observer location">
    <label for="lat-in">LAT</label><input id="lat-in" inputmode="decimal" autocomplete="off">
    <label for="lon-in">LON</label><input id="lon-in" inputmode="decimal" autocomplete="off">
    <button id="set-station">SET</button>
    <button id="locate">LOCATE ME</button>
    <span id="station-status"></span>
  </div>
  <footer>
    <div class="cell"><div class="k">SUNRISE</div><div class="v" id="rise">—</div></div>
    <div class="cell"><div class="k">SUNSET</div><div class="v" id="set">—</div></div>
    <div class="cell"><div class="k">MOON</div><div class="v" id="moon">—</div></div>
    <div class="cell"><div class="k">STATION</div><div class="v" id="station">—</div></div>
  </footer>
  <div class="note">"AND LET THEM BE FOR SIGNS AND SEASONS, AND FOR DAYS AND YEARS" — GENESIS 1:14</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
