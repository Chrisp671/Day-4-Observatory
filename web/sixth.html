<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day4 — the Sixth Hour and the Axis, four ways</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#F6F0E2;--stone:#C7D6E8;--dim:#9BB9D6;
    --gold:#D9A62B;--gold-lit:#F7DE93;--gold-white:#FFF7DD;--gold-shadow:#6E4E12}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%}
  body{font-family:"Fraunces",Georgia,serif;background:#050F1E;color:var(--ink);
    overflow-x:hidden}
  .sec{position:relative;min-height:100dvh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:28px 20px 34px;gap:12px;
    overflow:hidden}
  .bg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
  .sec > *:not(.bg){position:relative;z-index:1}
  .gilt{background:linear-gradient(180deg,var(--gold-white),var(--gold-lit) 38%,
      var(--gold) 76%,var(--gold-shadow));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .kicker{font-family:"Cinzel",serif;font-weight:600;font-size:10px;
    letter-spacing:.4em;text-indent:.4em;text-transform:uppercase;text-align:center}
  .title{font-family:"Cinzel",serif;font-weight:700;font-size:clamp(19px,5.2vw,27px);
    letter-spacing:.05em;text-align:center}
  canvas.dial{display:block}
  .why{font-size:14.5px;line-height:1.5;color:var(--stone);max-width:33ch;
    text-align:center;font-style:italic}
  .refs{font-family:"Cinzel",serif;font-weight:600;font-size:9.5px;letter-spacing:.24em;
    text-indent:.24em;text-transform:uppercase;text-align:center}
  .lead{padding:46px 22px 10px;text-align:center;max-width:34rem;margin:0 auto}
  .lead h1{font-family:"Cinzel",serif;font-size:14px;letter-spacing:.28em;
    text-indent:.28em;text-transform:uppercase;font-weight:700}
  .lead p{margin-top:12px;font-size:16px;font-style:italic;line-height:1.5;
    color:var(--stone)}
</style>
</head>
<body>
<div class="lead">
  <h1 class="gilt">The Sixth Hour &amp; the Axis</h1>
  <p>One recommendation, four voices. In every version the cross holds the dial,
  and the hours from noon to three carry the darkness. Only the volume changes.</p>
</div>

<script id="tpl" type="text/template">
  <canvas class="bg"></canvas>
  <div class="kicker gilt">__KICKER__</div>
  <div class="title gilt">__TITLE__</div>
  <canvas class="dial"></canvas>
  <p class="why">__WHY__</p>
  <div class="refs gilt">Colossians 1:17 &middot; Mark 15:33 &middot; ESV</div>
</script>

<script>
const TAU = Math.PI * 2;
const RISE = 5.18, SET = 18.80, SUN_H = 15.4, MOON_H = 2.4, NOW_H = 15.4;
const hourAngle = (h) => (h / 24) * TAU + Math.PI / 2;
const GOLD = [[0,"#FFF7DD"],[0.35,"#F7DE93"],[0.7,"#D9A62B"],[1,"#6E4E12"]];
function gold(ctx, y0, y1) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  for (const [at, c] of GOLD) g.addColorStop(at, c);
  return g;
}
const seeded = (s) => () => (s = (s * 1103515245 + 12345) % 2147483648) / 2147483648;

function fit(c, w, h, maxDpr) {
  const ctx = c.getContext("2d");
  const dpr = Math.min(window.devicePixelRatio || 1, maxDpr);
  c.width = Math.floor(w * dpr); c.height = Math.floor(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return ctx;
}

function drawSky(c, w, h) {
  const ctx = fit(c, w, h, 1.5);
  const g = ctx.createRadialGradient(w * 0.5, h * 0.42, 0, w * 0.5, h * 0.46, Math.max(w, h) * 0.9);
  g.addColorStop(0, "#16345E"); g.addColorStop(0.5, "#0E2440"); g.addColorStop(1, "#050F1E");
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  const rnd = seeded(4004);
  for (let i = 0; i < 250; i++) {
    const x = rnd() * w, y = rnd() * h, faint = rnd() < 0.85;
    ctx.globalAlpha = faint ? 0.2 + rnd() * 0.3 : 0.6 + rnd() * 0.4;
    ctx.fillStyle = "#DCE8F5";
    ctx.beginPath(); ctx.arc(x, y, faint ? 0.8 : 1.5, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/** The band, with the three hours withdrawn to the depth a version asks for. */
function band(ctx, rOut, rIn, depth) {
  const SEG = 288;
  for (let i = 0; i < SEG; i++) {
    const h0 = (i / SEG) * 24, h1 = ((i + 1) / SEG) * 24, mid = (h0 + h1) / 2;
    const day = mid > RISE && mid < SET;
    const dT = Math.min(Math.abs(mid - RISE), Math.abs(mid - SET));
    const t = Math.max(0, 1 - dT / 1.15) ** 1.4;
    const base = day ? [30, 66, 112] : [10, 27, 51];
    const amber = [206, 122, 58];
    let rgb = [
      base[0] + (amber[0] - base[0]) * t,
      base[1] + (amber[1] - base[1]) * t,
      base[2] + (amber[2] - base[2]) * t,
    ];
    if (mid >= 12 && mid <= 15) {
      const soften = Math.min(1, Math.min(mid - 12, 15 - mid) / 0.45);
      const d = depth * (0.4 + 0.6 * soften);
      rgb = rgb.map((v) => v * (1 - d) + 5 * d);
    }
    ctx.fillStyle = `rgb(${rgb.map(Math.round).join(",")})`;
    ctx.beginPath();
    ctx.arc(0, 0, rOut, hourAngle(h0), hourAngle(h1));
    ctx.arc(0, 0, rIn, hourAngle(h1), hourAngle(h0), true);
    ctx.closePath(); ctx.fill();
  }
  ctx.lineWidth = 1.4;
  for (const r of [rOut, rIn]) {
    ctx.strokeStyle = gold(ctx, -r, r);
    ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
  }
}

function ticks(ctx, rOut, rIn, size) {
  for (let i = 0; i < 48; i++) {
    const a = hourAngle(i / 2), major = i % 12 === 0, half = i % 2 === 1;
    const r1 = rIn - size * 0.009;
    const r2 = r1 - (major ? size * 0.034 : half ? size * 0.009 : size * 0.018);
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
    ctx.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
    ctx.lineWidth = major ? 2 : 0.9;
    ctx.strokeStyle = major ? gold(ctx, -r1, r1) : "rgba(199,214,232,0.5)";
    ctx.stroke();
  }
  for (let hh = 0; hh < 24; hh += 6) {
    const a = hourAngle(hh), rt = rIn - size * 0.082;
    ctx.save();
    ctx.font = `600 ${size * 0.042}px Cinzel, serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = gold(ctx, -size * 0.028, size * 0.028);
    ctx.fillText(String(hh).padStart(2, "0"), Math.cos(a) * rt, Math.sin(a) * rt);
    ctx.restore();
  }
}

function earth(ctx, rE) {
  const eg = ctx.createRadialGradient(-rE * 0.3, -rE * 0.3, 0, 0, 0, rE);
  eg.addColorStop(0, "#24528F"); eg.addColorStop(1, "#08172B");
  ctx.fillStyle = eg;
  ctx.beginPath(); ctx.arc(0, 0, rE, 0, TAU); ctx.fill();
  ctx.strokeStyle = gold(ctx, -rE, rE); ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.arc(0, 0, rE, 0, TAU); ctx.stroke();
  ctx.strokeStyle = "rgba(199,214,232,0.30)"; ctx.lineWidth = 0.8;
  for (const f of [-0.62, -0.32, 0, 0.32, 0.62]) {
    ctx.beginPath();
    ctx.ellipse(0, rE * f, rE * Math.sqrt(1 - f * f), rE * 0.10, 0, 0, TAU);
    ctx.stroke();
  }
  ctx.beginPath(); ctx.ellipse(0, 0, rE * 0.34, rE, 0, 0, TAU); ctx.stroke();
  ctx.save();
  ctx.beginPath(); ctx.arc(0, 0, rE, -Math.PI / 2, Math.PI / 2); ctx.closePath();
  ctx.fillStyle = "rgba(5,15,30,0.58)"; ctx.fill();
  ctx.restore();
}

function lights(ctx, size, rBand) {
  const aS = hourAngle(SUN_H), rS = size * 0.032;
  const sx = Math.cos(aS) * rBand, sy = Math.sin(aS) * rBand;
  const sg = ctx.createRadialGradient(sx - rS * 0.35, sy - rS * 0.45, 0, sx, sy, rS);
  sg.addColorStop(0, "#FFF7DD"); sg.addColorStop(0.45, "#F7DE93");
  sg.addColorStop(0.85, "#D9A62B"); sg.addColorStop(1, "#8A6416");
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(sx, sy, rS, 0, TAU); ctx.fill();
  const aM = hourAngle(MOON_H), rM = size * 0.027;
  const mx = Math.cos(aM) * rBand, my = Math.sin(aM) * rBand;
  ctx.fillStyle = "#F6F0E2";
  ctx.beginPath(); ctx.arc(mx, my, rM, 0, TAU); ctx.fill();
  ctx.fillStyle = "rgba(8,20,40,0.92)";
  ctx.beginPath(); ctx.arc(mx - rM * 0.42, my, rM * 0.96, 0, TAU); ctx.fill();
}

/** "Now": a plain index, never the cross. */
function gnomon(ctx, rOut, rIn, h) {
  const a = hourAngle(h), w = rOut - rIn;
  ctx.save();
  ctx.translate(Math.cos(a) * (rOut + w * 0.30), Math.sin(a) * (rOut + w * 0.30));
  ctx.rotate(a + Math.PI / 2);
  ctx.fillStyle = "#E7F0FA"; ctx.globalAlpha = 0.75;
  ctx.beginPath();
  ctx.moveTo(0, w * 0.32); ctx.lineTo(-w * 0.28, -w * 0.28); ctx.lineTo(w * 0.28, -w * 0.28);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;
}

/** The cross standing over the darkened hours, always upright. */
function standingCross(ctx, size, rOut, weight, glow) {
  const a = hourAngle(13.5), arm = size * 0.05;
  const cx = Math.cos(a) * (rOut + arm * 1.4), cy = Math.sin(a) * (rOut + arm * 1.4);
  ctx.save();
  ctx.translate(cx, cy);
  if (glow === true) {
    ctx.shadowColor = "rgba(247,222,147,0.85)";
    ctx.shadowBlur = size * 0.05;
  }
  ctx.lineCap = "round";
  ctx.lineWidth = size * weight;
  ctx.strokeStyle = gold(ctx, -arm * 1.2, arm * 1.2);
  ctx.beginPath();
  ctx.moveTo(0, -arm * 1.15); ctx.lineTo(0, arm * 1.0);
  ctx.moveTo(-arm * 0.66, -arm * 0.42); ctx.lineTo(arm * 0.66, -arm * 0.42);
  ctx.stroke();
  ctx.restore();
}

/** The axis: what the dial turns upon, in four materials. */
function axis(ctx, R, size, style) {
  ctx.save();
  ctx.lineCap = "butt";
  const V0 = -R * 0.60, V1 = R * 0.74, H = R * 0.47, Y = -R * 0.20;
  if (style === "engraved") {
    // An incised line: two hairlines with the ground showing between them.
    ctx.strokeStyle = gold(ctx, V0, V1);
    ctx.globalAlpha = 0.85;
    ctx.lineWidth = Math.max(1, size * 0.0035);
    const o = size * 0.008;
    ctx.beginPath();
    ctx.moveTo(-o, V0); ctx.lineTo(-o, V1); ctx.moveTo(o, V0); ctx.lineTo(o, V1);
    ctx.moveTo(-H, Y - o); ctx.lineTo(H, Y - o); ctx.moveTo(-H, Y + o); ctx.lineTo(H, Y + o);
    ctx.stroke();
  } else if (style === "glow") {
    // Light rather than metal.
    ctx.shadowColor = "rgba(247,222,147,0.9)";
    ctx.shadowBlur = size * 0.055;
    ctx.strokeStyle = "rgba(247,222,147,0.5)";
    ctx.globalAlpha = 0.75;
    ctx.lineWidth = size * 0.013;
    ctx.beginPath();
    ctx.moveTo(0, V0); ctx.lineTo(0, V1); ctx.moveTo(-H, Y); ctx.lineTo(H, Y);
    ctx.stroke();
  } else {
    ctx.strokeStyle = gold(ctx, V0, V1);
    ctx.globalAlpha = style === "bold" ? 0.62 : 0.3;
    ctx.lineWidth = size * (style === "bold" ? 0.026 : 0.016);
    ctx.beginPath();
    ctx.moveTo(0, V0); ctx.lineTo(0, V1); ctx.moveTo(-H, Y); ctx.lineTo(H, Y);
    ctx.stroke();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

/** Gold bounds at the sixth and the ninth hour — where the darkness begins and ends. */
function hourBounds(ctx, rOut, rIn, rimmed) {
  for (const h of [12, 15]) {
    const a = hourAngle(h);
    ctx.save();
    if (rimmed === true) { ctx.shadowColor = "rgba(247,222,147,0.9)"; ctx.shadowBlur = 8; }
    ctx.strokeStyle = gold(ctx, -rOut, rOut);
    ctx.lineWidth = rimmed === true ? 2.6 : 2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * rIn, Math.sin(a) * rIn);
    ctx.lineTo(Math.cos(a) * rOut, Math.sin(a) * rOut);
    ctx.stroke();
    ctx.restore();
  }
}

/** Cross-hatch the darkened hours instead of flooding them — an engraver's shadow. */
function hatch(ctx, rOut, rIn, size) {
  ctx.save();
  ctx.beginPath();
  ctx.arc(0, 0, rOut, hourAngle(12), hourAngle(15));
  ctx.arc(0, 0, rIn, hourAngle(15), hourAngle(12), true);
  ctx.closePath();
  ctx.clip();
  ctx.strokeStyle = "rgba(5,10,20,0.85)";
  ctx.lineWidth = Math.max(1, size * 0.0035);
  for (let d = -rOut * 2; d < rOut * 2; d += size * 0.011) {
    ctx.beginPath(); ctx.moveTo(d, -rOut); ctx.lineTo(d + rOut * 2, rOut); ctx.stroke();
  }
  ctx.restore();
}

const VERSIONS = [
  {
    kicker: "One", title: "Quiet",
    why: "The cross is barely there — a shadow of gold under the instrument — and the three hours dim rather than blacken. Reverence by restraint: you find it, it does not announce itself.",
    draw(ctx, size, R, rOut, rIn) {
      band(ctx, rOut, rIn, 0.55);
      ticks(ctx, rOut, rIn, size);
      axis(ctx, R, size, "faint");
      hourBounds(ctx, rOut, rIn, false);
      earth(ctx, R * 0.245);
      lights(ctx, size, (rOut + rIn) / 2);
      standingCross(ctx, size, rOut, 0.011, false);
      gnomon(ctx, rOut, rIn, NOW_H);
    },
  },
  {
    kicker: "Two", title: "Declared",
    why: "Full weight. The axis is unmistakable gold, the darkness goes to near black, and the cross stands tall over it. Nobody opens this and wonders what it is about.",
    draw(ctx, size, R, rOut, rIn) {
      band(ctx, rOut, rIn, 0.92);
      ticks(ctx, rOut, rIn, size);
      axis(ctx, R, size, "bold");
      hourBounds(ctx, rOut, rIn, false);
      earth(ctx, R * 0.245);
      lights(ctx, size, (rOut + rIn) / 2);
      standingCross(ctx, size, rOut, 0.017, false);
      gnomon(ctx, rOut, rIn, NOW_H);
    },
  },
  {
    kicker: "Three", title: "Radiant",
    why: "The cross as light, not metal — it glows from behind the earth, and the darkened hours are edged in gold at their bounds. The darkness is real, and it is bounded on both sides by light.",
    draw(ctx, size, R, rOut, rIn) {
      band(ctx, rOut, rIn, 0.88);
      ticks(ctx, rOut, rIn, size);
      axis(ctx, R, size, "glow");
      hourBounds(ctx, rOut, rIn, true);
      earth(ctx, R * 0.245);
      lights(ctx, size, (rOut + rIn) / 2);
      standingCross(ctx, size, rOut, 0.013, true);
      gnomon(ctx, rOut, rIn, NOW_H);
    },
  },
  {
    kicker: "Four", title: "Engraved",
    why: "The atlas treatment. The axis is incised — two hairlines with the ground between them — and the three hours are cross-hatched the way an engraver shades. The most instrument-like, and the most restrained on the eye.",
    draw(ctx, size, R, rOut, rIn) {
      band(ctx, rOut, rIn, 0.35);
      hatch(ctx, rOut, rIn, size);
      ticks(ctx, rOut, rIn, size);
      axis(ctx, R, size, "engraved");
      hourBounds(ctx, rOut, rIn, false);
      earth(ctx, R * 0.245);
      lights(ctx, size, (rOut + rIn) / 2);
      standingCross(ctx, size, rOut, 0.012, false);
      gnomon(ctx, rOut, rIn, NOW_H);
    },
  },
];

const tpl = document.getElementById("tpl").textContent;
for (const v of VERSIONS) {
  const el = document.createElement("section");
  el.className = "sec";
  el.innerHTML = tpl.replace("__KICKER__", v.kicker)
    .replace("__TITLE__", v.title).replace("__WHY__", v.why);
  document.body.appendChild(el);
  v.el = el;
}

function render() {
  for (const v of VERSIONS) {
    const r = v.el.getBoundingClientRect();
    drawSky(v.el.querySelector(".bg"), Math.round(r.width), Math.round(r.height));
    const size = Math.min(window.innerWidth - 74, Math.round(window.innerHeight * 0.42), 430);
    const d = v.el.querySelector(".dial");
    d.style.width = size + "px"; d.style.height = size + "px";
    const ctx = fit(d, size, size, 2);
    ctx.translate(size / 2, size / 2);
    const R = size * 0.435, rOut = R * 0.985, rIn = R * 0.795;
    v.draw(ctx, size, R, rOut, rIn);
  }
}
render();
window.addEventListener("resize", render);
document.fonts?.ready.then(render);
</script>
</body>
</html>
