<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day4 — The Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&display=swap" rel="stylesheet">
<style>
  :root{
    /* Lapis lazuli — the pigment reserved for heaven. */
    --lapis-lit:#1B3F7A; --lapis:#122C57; --lapis-deep:#081124; --rim:#03080F;
    /* Gold leaf is a material, not a colour: shadow, body, specular. */
    --gold-shadow:#6E4E12; --gold:#D9A62B; --gold-lit:#F7DE93; --gold-white:#FFF7DD;
    --ivory:#F6F0E2; --stone:#C7D6E8; --stone-dim:#8FA9C6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--rim);color:var(--ivory);
    font-family:"Fraunces",Georgia,serif;overflow-x:hidden}
  #vault{position:fixed;inset:0;width:100vw;height:100dvh;z-index:-1}

  .shell{min-height:100dvh;display:flex;flex-direction:column;align-items:center;
    padding:26px 18px 34px;gap:14px}
  .brand{height:38px;display:block;filter:drop-shadow(0 3px 14px rgba(0,0,0,.7))}

  /* The dedication: gold-leaf capitals, carved not printed. */
  .dedication{font-family:"Cinzel",serif;font-weight:600;font-size:11px;
    letter-spacing:.44em;text-transform:uppercase;text-indent:.44em;
    background:linear-gradient(180deg,var(--gold-white),var(--gold) 55%,var(--gold-shadow));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-align:center}

  .verse{font-size:clamp(20px,4.6vw,27px);font-style:italic;font-weight:600;
    line-height:1.34;color:var(--ivory);max-width:20ch;text-align:center;
    text-wrap:balance;text-shadow:0 2px 18px rgba(0,0,0,.85);margin-top:2px}
  .ref{font-family:"Cinzel",serif;font-weight:600;font-size:12px;
    letter-spacing:.3em;text-indent:.3em;text-transform:uppercase;
    background:linear-gradient(180deg,var(--gold-lit),var(--gold) 60%,var(--gold-shadow));
    -webkit-background-clip:text;background-clip:text;color:transparent}

  .hero{font-size:clamp(29px,7.4vw,40px);font-weight:600;text-align:center;
    line-height:1.05;text-shadow:0 2px 16px rgba(0,0,0,.8)}
  .hero b{font-weight:700;
    background:linear-gradient(180deg,var(--gold-white),var(--gold-lit) 40%,var(--gold) 78%,var(--gold-shadow));
    -webkit-background-clip:text;background-clip:text;color:transparent}

  canvas#dial{display:block;filter:drop-shadow(0 10px 40px rgba(0,0,0,.55))}

  .plinth{width:100%;max-width:520px;display:grid;grid-template-columns:1fr 1fr;
    gap:16px 20px;border-top:1px solid rgba(217,166,43,.32);padding-top:16px}
  .cell{text-align:center}
  .k{font-family:"Cinzel",serif;font-weight:600;font-size:11px;letter-spacing:.26em;
    text-indent:.26em;color:var(--stone-dim);text-transform:uppercase;margin-bottom:4px}
  .v{font-size:26px;font-weight:600;color:var(--ivory);line-height:1.1}
  .v.gold{background:linear-gradient(180deg,var(--gold-lit),var(--gold) 70%,var(--gold-shadow));
    -webkit-background-clip:text;background-clip:text;color:transparent}

  .tonight{width:100%;max-width:520px;border-top:1px solid rgba(217,166,43,.32);
    padding-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:11px 20px}
  .sky b{display:block;font-family:"Cinzel",serif;font-weight:600;font-size:12.5px;
    letter-spacing:.14em;color:var(--ivory)}
  .sky span{font-size:15px;color:var(--stone)}
  .sky.up b{background:linear-gradient(180deg,var(--gold-lit),var(--gold) 70%);
    -webkit-background-clip:text;background-clip:text;color:transparent}

  .note{font-family:"Cinzel",serif;font-size:10px;letter-spacing:.3em;
    color:var(--stone-dim);text-align:center;text-transform:uppercase;margin-top:2px}
</style>
</head>
<body>
<canvas id="vault"></canvas>
<div class="shell">
  <img class="brand" src="day4-logo-dark.png" alt="Day4 Astronomy">
  <div class="dedication">On the fourth day</div>
  <p class="verse">&ldquo;And God made the two great lights.&rdquo;</p>
  <div class="ref">Genesis 1:16 &middot; ESV</div>
  <canvas id="dial"></canvas>
  <div class="hero">Sunset in <b>10h 57m</b></div>
  <div class="plinth">
    <div class="cell"><div class="k">Sunrise</div><div class="v gold">05:11</div></div>
    <div class="cell"><div class="k">Sunset</div><div class="v gold">18:48</div></div>
  </div>
  <div class="tonight">
    <div class="sky up"><b>Orion</b><span>sets in 5h 03m</span></div>
    <div class="sky up"><b>Ursa Major</b><span>up all night</span></div>
  </div>
  <div class="note">The vault &middot; a direction</div>
</div>

<script>
const TAU = Math.PI * 2;
/* Gen 1:14 — the charter, carried around the ring the way a cathedral
   carries its text on the architecture itself. */
const INSCRIPTION_TOP = "AND LET THEM BE FOR SIGNS AND FOR SEASONS";
const INSCRIPTION_FOOT = "AND FOR DAYS AND YEARS";

function goldFill(ctx, y0, y1) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, "#FFF7DD");
  g.addColorStop(0.35, "#F7DE93");
  g.addColorStop(0.7, "#D9A62B");
  g.addColorStop(1, "#6E4E12");
  return g;
}

/* An eight-pointed star: Giotto's, on the Arena Chapel vault. */
function giottoStar(ctx, x, y, r, alpha) {
  ctx.save();
  ctx.translate(x, y);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = goldFill(ctx, -r, r);
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * TAU;
    const long = i % 2 === 0 ? r : r * 0.42;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(a - 0.13) * long * 0.34, Math.sin(a - 0.13) * long * 0.34);
    ctx.lineTo(Math.cos(a) * long, Math.sin(a) * long);
    ctx.lineTo(Math.cos(a + 0.13) * long * 0.34, Math.sin(a + 0.13) * long * 0.34);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

/* Text bent around a circle — one glyph at a time, each on its own radius. */
function arcText(ctx, text, radius, centerAngle, size, spacing, flip) {
  ctx.save();
  ctx.font = `600 ${size}px Cinzel, serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  const widths = [...text].map((ch) => ctx.measureText(ch).width + spacing);
  const total = widths.reduce((a, b) => a + b, 0);
  // A frieze runs both ways round the building: the footer arc is walked
  // backwards and each glyph turned, so it still reads left to right.
  const dir = flip === true ? -1 : 1;
  let angle = centerAngle - (dir * total) / (2 * radius);
  for (let i = 0; i < text.length; i++) {
    const step = (dir * widths[i]) / (2 * radius);
    angle += step;
    ctx.save();
    ctx.rotate(angle);
    ctx.translate(0, -radius);
    if (flip === true) ctx.rotate(Math.PI);
    ctx.fillStyle = goldFill(ctx, -size * 0.62, size * 0.62);
    ctx.fillText(text[i], 0, 0);
    ctx.restore();
    angle += step;
  }
  ctx.restore();
}

function drawVault() {
  const c = document.getElementById("vault");
  const ctx = c.getContext("2d");
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  const w = window.innerWidth, h = window.innerHeight;
  c.width = Math.floor(w * dpr); c.height = Math.floor(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // A dome, not a wall: light gathers at the crown and falls away to the rim.
  const g = ctx.createRadialGradient(w * 0.5, h * 0.34, 0, w * 0.5, h * 0.42, Math.max(w, h) * 0.82);
  g.addColorStop(0, "#1B3F7A");
  g.addColorStop(0.42, "#122C57");
  g.addColorStop(0.78, "#081124");
  g.addColorStop(1, "#03080F");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);

  // Gold stars, ordered like a ceiling rather than scattered like noise.
  let seed = 7;
  const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
  for (let i = 0; i < 46; i++) {
    const x = rnd() * w, y = rnd() * h;
    const d = Math.hypot(x - w * 0.5, y - h * 0.42) / Math.max(w, h);
    giottoStar(ctx, x, y, 3 + rnd() * 5, 0.30 + (1 - d) * 0.5);
  }
}

function drawDial() {
  const c = document.getElementById("dial");
  const ctx = c.getContext("2d");
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const size = Math.min(window.innerWidth - 44, Math.round(window.innerHeight * 0.44), 520);
  c.width = size * dpr; c.height = size * dpr;
  c.style.width = size + "px"; c.style.height = size + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, size, size);
  ctx.translate(size / 2, size / 2);
  const R = size * 0.5;

  // The oculus: a light-well at the centre of the dome.
  const well = ctx.createRadialGradient(0, 0, 0, 0, 0, R * 0.62);
  well.addColorStop(0, "rgba(247,222,147,0.20)");
  well.addColorStop(0.55, "rgba(27,63,122,0.16)");
  well.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = well;
  ctx.beginPath(); ctx.arc(0, 0, R * 0.62, 0, TAU); ctx.fill();

  // Two gold hairlines bound the inscription band — the frieze.
  const rOuter = R * 0.985, rInner = R * 0.80;
  ctx.lineWidth = 1.4;
  for (const r of [rOuter, rInner]) {
    ctx.strokeStyle = goldFill(ctx, -r, r);
    ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
  }
  // Scripture as architecture: the charter runs around the building.
  const rFrieze = (rOuter + rInner) / 2 + size * 0.022;
  arcText(ctx, INSCRIPTION_TOP, rFrieze, 0, size * 0.043, size * 0.004, false);
  arcText(ctx, INSCRIPTION_FOOT, rFrieze, Math.PI, size * 0.043, size * 0.004, true);

  // The hour ring: carved marks, gold at the cardinal hours.
  for (let hh = 0; hh < 24; hh++) {
    const a = (hh / 24) * TAU + Math.PI / 2;
    const major = hh % 6 === 0;
    const r1 = rInner - size * 0.012, r2 = r1 - (major ? size * 0.045 : size * 0.022);
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
    ctx.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
    ctx.lineWidth = major ? 2 : 1;
    ctx.strokeStyle = major ? goldFill(ctx, -r1, r1) : "rgba(199,214,232,0.55)";
    ctx.stroke();
    if (major) {
      const rt = r2 - size * 0.045;
      ctx.save();
      ctx.font = `600 ${size * 0.042}px Cinzel, serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillStyle = goldFill(ctx, -size * 0.03, size * 0.03);
      ctx.fillText(String(hh).padStart(2, "0"), Math.cos(a) * rt, Math.sin(a) * rt);
      ctx.restore();
    }
  }

  // The earth, held in the light-well.
  const rEarth = R * 0.30;
  const eg = ctx.createRadialGradient(-rEarth * 0.3, -rEarth * 0.3, 0, 0, 0, rEarth);
  eg.addColorStop(0, "#24528F");
  eg.addColorStop(1, "#0A1A33");
  ctx.fillStyle = eg;
  ctx.beginPath(); ctx.arc(0, 0, rEarth, 0, TAU); ctx.fill();
  ctx.strokeStyle = goldFill(ctx, -rEarth, rEarth);
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(0, 0, rEarth, 0, TAU); ctx.stroke();
  ctx.strokeStyle = "rgba(199,214,232,0.30)";
  ctx.lineWidth = 0.8;
  for (const f of [-0.62, -0.32, 0, 0.32, 0.62]) {
    ctx.beginPath();
    ctx.ellipse(0, rEarth * f, rEarth * Math.sqrt(1 - f * f), rEarth * 0.10, 0, 0, TAU);
    ctx.stroke();
  }
  ctx.beginPath(); ctx.ellipse(0, 0, rEarth * 0.34, rEarth, 0, 0, TAU); ctx.stroke();
  // Night falls across half the world.
  ctx.save();
  ctx.beginPath(); ctx.arc(0, 0, rEarth, -Math.PI / 2, Math.PI / 2); ctx.closePath();
  ctx.fillStyle = "rgba(3,8,15,0.62)"; ctx.fill();
  ctx.restore();

  // The greater light: gold leaf, with a specular kiss.
  const aSun = (18.8 / 24) * TAU + Math.PI / 2;
  const rBand = (rOuter + rInner) / 2 - size * 0.055;
  const sx = Math.cos(aSun) * rBand, sy = Math.sin(aSun) * rBand, rSun = size * 0.036;
  const clear = (x, y, r) => {
    const halo = ctx.createRadialGradient(x, y, r * 0.7, x, y, r * 2.1);
    halo.addColorStop(0, "rgba(8,17,36,0.92)");
    halo.addColorStop(1, "rgba(8,17,36,0)");
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(x, y, r * 2.1, 0, TAU); ctx.fill();
  };
  clear(sx, sy, rSun);
  const sg = ctx.createRadialGradient(sx - rSun * 0.35, sy - rSun * 0.45, 0, sx, sy, rSun);
  sg.addColorStop(0, "#FFF7DD");
  sg.addColorStop(0.45, "#F7DE93");
  sg.addColorStop(0.85, "#D9A62B");
  sg.addColorStop(1, "#8A6416");
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(sx, sy, rSun, 0, TAU); ctx.fill();

  // The lesser light.
  const aMoon = (2.4 / 24) * TAU + Math.PI / 2;
  const mx = Math.cos(aMoon) * rBand, my = Math.sin(aMoon) * rBand, rMoon = size * 0.030;
  clear(mx, my, rMoon);
  ctx.fillStyle = "#F6F0E2";
  ctx.beginPath(); ctx.arc(mx, my, rMoon, 0, TAU); ctx.fill();
  ctx.fillStyle = "rgba(8,17,36,0.92)";
  ctx.beginPath(); ctx.arc(mx - rMoon * 0.42, my, rMoon * 0.96, 0, TAU); ctx.fill();
}

function render() { drawVault(); drawDial(); }
render();
window.addEventListener("resize", render);
document.fonts?.ready.then(render);
</script>
</body>
</html>
