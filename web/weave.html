<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day4 — The Weave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#F6F0E2; --stone:#C7D6E8; --stone-dim:#9BB9D6;
    --gold:#D9A62B; --gold-lit:#F7DE93; --gold-white:#FFF7DD; --gold-shadow:#6E4E12;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%}
  body{font-family:"Fraunces",Georgia,serif;background:#050F1E;color:var(--ink);
    overflow-x:hidden}
  #sky{position:fixed;inset:0;width:100vw;height:100dvh;z-index:-1}
  .shell{min-height:100dvh;display:flex;flex-direction:column;align-items:center;
    padding:24px 18px 30px;gap:12px}
  .brand{height:36px;display:block;filter:drop-shadow(0 3px 14px rgba(0,0,0,.7))}
  .gilt{background:linear-gradient(180deg,var(--gold-white),var(--gold-lit) 38%,
      var(--gold) 76%,var(--gold-shadow));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .ded{font-family:"Cinzel",serif;font-weight:600;font-size:11px;letter-spacing:.42em;
    text-indent:.42em;text-transform:uppercase;text-align:center}
  .verse{font-size:clamp(19px,4.5vw,26px);font-style:italic;font-weight:600;
    line-height:1.33;max-width:21ch;text-align:center;text-wrap:balance;
    text-shadow:0 2px 16px rgba(0,0,0,.9)}
  .ref{font-family:"Cinzel",serif;font-weight:600;font-size:11.5px;letter-spacing:.3em;
    text-indent:.3em;text-transform:uppercase}
  canvas#dial{display:block}
  .hero{font-size:clamp(29px,7.4vw,39px);font-weight:600;text-align:center;line-height:1.05;
    text-shadow:0 2px 14px rgba(0,0,0,.8)}
  .hero b{font-weight:700}
  .plinth,.tonight{width:100%;max-width:500px;display:grid;grid-template-columns:1fr 1fr;
    gap:14px 20px;padding-top:14px;border-top:1px solid rgba(217,166,43,.34)}
  .cell,.sky{text-align:center;min-width:0}
  .k{font-family:"Cinzel",serif;font-weight:600;font-size:10.5px;letter-spacing:.24em;
    text-indent:.24em;text-transform:uppercase;color:var(--stone-dim);margin-bottom:3px}
  .v{font-size:26px;font-weight:600;line-height:1.1}
  .sky b{display:block;font-family:"Cinzel",serif;font-weight:600;font-size:12.5px;
    letter-spacing:.12em}
  .sky span{font-size:15px;color:var(--stone)}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="shell">
  <img class="brand" src="day4-logo-dark.png" alt="Day4 Astronomy">
  <p class="verse">&ldquo;And God made the two great lights&mdash;the greater light to rule the day and the lesser light to rule the night.&rdquo;</p>
  <div class="ref gilt">Genesis 1:16 &middot; ESV</div>
  <canvas id="dial"></canvas>
  <div class="hero">Sunset in <b class="gilt">10h 57m</b></div>
  <div class="plinth">
    <div class="cell"><div class="k">Sunrise</div><div class="v gilt">05:11</div></div>
    <div class="cell"><div class="k">Sunset</div><div class="v gilt">18:48</div></div>
  </div>
  <div class="tonight">
    <div class="sky"><b class="gilt">Orion</b><span>sets in 5h 03m</span></div>
    <div class="sky"><b class="gilt">Ursa Major</b><span>up all night</span></div>
  </div>
</div>

<script>
const TAU = Math.PI * 2;
const RISE = 5.18, SET = 18.80, SUN_H = 18.8, MOON_H = 2.4;
/* Noon at the top, midnight at the bottom, clockwise — the app's convention. */
const hourAngle = (h) => (h / 24) * TAU + Math.PI / 2;

const GOLD = [[0, "#FFF7DD"], [0.35, "#F7DE93"], [0.7, "#D9A62B"], [1, "#6E4E12"]];
function goldFill(ctx, y0, y1) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  for (const [at, c] of GOLD) g.addColorStop(at, c);
  return g;
}
function seeded(s) { return () => (s = (s * 1103515245 + 12345) % 2147483648) / 2147483648; }

function eightStar(ctx, x, y, r, alpha) {
  ctx.save(); ctx.translate(x, y); ctx.globalAlpha = alpha;
  ctx.fillStyle = goldFill(ctx, -r, r);
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * TAU, long = i % 2 === 0 ? r : r * 0.42;
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(a - 0.13) * long * 0.34, Math.sin(a - 0.13) * long * 0.34);
    ctx.lineTo(Math.cos(a) * long, Math.sin(a) * long);
    ctx.lineTo(Math.cos(a + 0.13) * long * 0.34, Math.sin(a + 0.13) * long * 0.34);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function fit(c, w, h, maxDpr) {
  const ctx = c.getContext("2d");
  const dpr = Math.min(window.devicePixelRatio || 1, maxDpr);
  c.width = Math.floor(w * dpr); c.height = Math.floor(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return ctx;
}

function drawSky() {
  const c = document.getElementById("sky");
  const w = window.innerWidth, h = window.innerHeight;
  const ctx = fit(c, w, h, 1.5);
  const g = ctx.createRadialGradient(w * 0.5, h * 0.40, 0, w * 0.5, h * 0.45, Math.max(w, h) * 0.9);
  g.addColorStop(0, "#16345E"); g.addColorStop(0.5, "#0E2440"); g.addColorStop(1, "#050F1E");
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

  const rnd = seeded(4004);
  ctx.save();
  ctx.translate(w * 0.5, h * 0.42); ctx.rotate(-0.55);
  for (let i = 0; i < 20; i++) {
    const x = (rnd() - 0.5) * w * 2.2, y = (rnd() - 0.5) * h * 0.16, r = 60 + rnd() * 130;
    const haze = ctx.createRadialGradient(x, y, 0, x, y, r);
    haze.addColorStop(0, "rgba(150,180,220,0.055)");
    haze.addColorStop(1, "rgba(150,180,220,0)");
    ctx.fillStyle = haze; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  }
  ctx.restore();
  for (let i = 0; i < 300; i++) {
    const x = rnd() * w, y = rnd() * h, faint = rnd() < 0.85;
    ctx.globalAlpha = faint ? 0.22 + rnd() * 0.3 : 0.6 + rnd() * 0.4;
    ctx.fillStyle = "#DCE8F5";
    ctx.beginPath(); ctx.arc(x, y, faint ? 0.8 : 1.5, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (let i = 0; i < 14; i++) eightStar(ctx, rnd() * w, rnd() * h, 3.5 + rnd() * 4, 0.5);
}

function drawDial() {
  const c = document.getElementById("dial");
  const size = Math.min(window.innerWidth - 44, Math.round(window.innerHeight * 0.46), 500);
  c.style.width = size + "px"; c.style.height = size + "px";
  const ctx = fit(c, size, size, 2);
  ctx.translate(size / 2, size / 2);
  const R = size * 0.5, rOuter = R * 0.985, rInner = R * 0.795;

  /* The band now carries the day itself: night, twilight, daylight —
     the information the ring used to spend on decoration. */
  const SEG = 288;
  for (let i = 0; i < SEG; i++) {
    const h0 = (i / SEG) * 24, h1 = ((i + 1) / SEG) * 24;
    const mid = (h0 + h1) / 2;
    const day = mid > RISE && mid < SET;
    // Distance to the nearest horizon crossing, in hours.
    const dTwi = Math.min(Math.abs(mid - RISE), Math.abs(mid - SET));
    const twi = Math.max(0, 1 - dTwi / 1.15);
    let fill = day ? "#1E4270" : "#0A1B33";
    if (twi > 0) {
      const t = Math.pow(twi, 1.4);
      const base = day ? [30, 66, 112] : [10, 27, 51];
      const amber = [206, 122, 58];
      fill = `rgb(${Math.round(base[0] + (amber[0] - base[0]) * t)},${
        Math.round(base[1] + (amber[1] - base[1]) * t)},${
        Math.round(base[2] + (amber[2] - base[2]) * t)})`;
    }
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.arc(0, 0, rOuter, hourAngle(h0), hourAngle(h1));
    ctx.arc(0, 0, rInner, hourAngle(h1), hourAngle(h0), true);
    ctx.closePath(); ctx.fill();
  }

  // Gold hairlines bound the band, top and bottom.
  ctx.lineWidth = 1.4;
  for (const r of [rOuter, rInner]) {
    ctx.strokeStyle = goldFill(ctx, -r, r);
    ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
  }
  // The two horizon crossings, marked in gold across the band.
  for (const h of [RISE, SET]) {
    const a = hourAngle(h);
    ctx.strokeStyle = goldFill(ctx, -rOuter, rOuter); ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * rInner, Math.sin(a) * rInner);
    ctx.lineTo(Math.cos(a) * rOuter, Math.sin(a) * rOuter);
    ctx.stroke();
  }

  // The instrument's own cadence: 30-minute marks, hours, six-hour majors.
  for (let i = 0; i < 48; i++) {
    const a = hourAngle(i / 2);
    const major = i % 12 === 0, half = i % 2 === 1;
    const r1 = rInner - size * 0.010;
    const r2 = r1 - (major ? size * 0.040 : half ? size * 0.011 : size * 0.021);
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
    ctx.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
    ctx.lineWidth = major ? 2 : 0.9;
    ctx.strokeStyle = major ? goldFill(ctx, -r1, r1) : "rgba(199,214,232,0.5)";
    ctx.stroke();
  }
  // Hours, in carved capitals, sitting inside the band.
  for (let hh = 0; hh < 24; hh += 6) {
    const a = hourAngle(hh), rt = rInner - size * 0.098;
    ctx.save();
    ctx.font = `600 ${size * 0.05}px Cinzel, serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = goldFill(ctx, -size * 0.034, size * 0.034);
    ctx.fillText(String(hh).padStart(2, "0"), Math.cos(a) * rt, Math.sin(a) * rt);
    ctx.restore();
  }

  // The sidereal ring the instrument already keeps.
  ctx.strokeStyle = "rgba(155,185,214,0.42)"; ctx.lineWidth = 0.9;
  ctx.beginPath(); ctx.arc(0, 0, R * 0.555, 0, TAU); ctx.stroke();
  for (let i = 0; i < 24; i++) {
    const a = (i / 24) * TAU, r1 = R * 0.555, r2 = r1 + size * 0.015;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
    ctx.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
    ctx.stroke();
  }

  // The earth, in its light-well.
  const rE = R * 0.30;
  const well = ctx.createRadialGradient(0, 0, rE, 0, 0, rE * 2.0);
  well.addColorStop(0, "rgba(247,222,147,0.12)");
  well.addColorStop(1, "rgba(247,222,147,0)");
  ctx.fillStyle = well;
  ctx.beginPath(); ctx.arc(0, 0, rE * 2.0, 0, TAU); ctx.fill();

  const eg = ctx.createRadialGradient(-rE * 0.3, -rE * 0.3, 0, 0, 0, rE);
  eg.addColorStop(0, "#24528F"); eg.addColorStop(1, "#08172B");
  ctx.fillStyle = eg;
  ctx.beginPath(); ctx.arc(0, 0, rE, 0, TAU); ctx.fill();
  ctx.strokeStyle = goldFill(ctx, -rE, rE); ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.arc(0, 0, rE, 0, TAU); ctx.stroke();
  ctx.strokeStyle = "rgba(199,214,232,0.32)"; ctx.lineWidth = 0.8;
  for (const f of [-0.62, -0.32, 0, 0.32, 0.62]) {
    ctx.beginPath();
    ctx.ellipse(0, rE * f, rE * Math.sqrt(1 - f * f), rE * 0.10, 0, 0, TAU);
    ctx.stroke();
  }
  ctx.beginPath(); ctx.ellipse(0, 0, rE * 0.34, rE, 0, 0, TAU); ctx.stroke();
  ctx.save();
  ctx.beginPath(); ctx.arc(0, 0, rE, -Math.PI / 2, Math.PI / 2); ctx.closePath();
  ctx.fillStyle = "rgba(5,15,30,0.60)"; ctx.fill();
  ctx.restore();

  // The two great lights, riding the band.
  const rBand = (rOuter + rInner) / 2;
  const aS = hourAngle(SUN_H), rS = size * 0.038;
  const sx = Math.cos(aS) * rBand, sy = Math.sin(aS) * rBand;
  const sg = ctx.createRadialGradient(sx - rS * 0.35, sy - rS * 0.45, 0, sx, sy, rS);
  sg.addColorStop(0, "#FFF7DD"); sg.addColorStop(0.45, "#F7DE93");
  sg.addColorStop(0.85, "#D9A62B"); sg.addColorStop(1, "#8A6416");
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(sx, sy, rS, 0, TAU); ctx.fill();

  const aM = hourAngle(MOON_H), rM = size * 0.031;
  const mx = Math.cos(aM) * rBand, my = Math.sin(aM) * rBand;
  ctx.fillStyle = "#F6F0E2";
  ctx.beginPath(); ctx.arc(mx, my, rM, 0, TAU); ctx.fill();
  ctx.fillStyle = "rgba(8,20,40,0.92)";
  ctx.beginPath(); ctx.arc(mx - rM * 0.42, my, rM * 0.96, 0, TAU); ctx.fill();
}

function render() { drawSky(); drawDial(); }
render();
window.addEventListener("resize", render);
document.fonts?.ready.then(render);
</script>
</body>
</html>
